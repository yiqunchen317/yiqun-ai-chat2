<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>益群的电子奴隶</title>

<style>
body{
    margin:0;
    background:linear-gradient(135deg,#0f172a,#020617);
    color:white;
    font-family:"Segoe UI",Arial;
    display:flex;
    flex-direction:column;
    height:100vh;
}

header{
    padding:18px;
    background:rgba(30,41,59,0.8);
    backdrop-filter:blur(10px);
    font-size:22px;
    font-weight:bold;
    letter-spacing:1px;
    border-bottom:1px solid rgba(255,255,255,0.08);
}

header{
    display:flex;
    align-items:center;
    gap:12px;
}

.title{
    flex:1;
    display:flex;
    align-items:center;
    gap:10px;
}

.headerActions{
    display:flex;
    align-items:center;
    gap:10px;
}

.iconBtn{
    width:42px;
    height:42px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:rgba(2,6,23,0.35);
    color:white;
    border:1px solid rgba(255,255,255,0.10);
    border-radius:10px;
    cursor:pointer;
    transition:0.2s;
}

.iconBtn:hover{
    transform:translateY(-1px);
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
}

.chipBtn{
    padding:10px 14px;
    background:rgba(2,6,23,0.35);
    border:1px solid rgba(255,255,255,0.10);
    color:white;
    border-radius:999px;
    cursor:pointer;
    font-weight:600;
    transition:0.2s;
}

.chipBtn:hover{
    transform:translateY(-1px);
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
}

.chipBtn.danger{
    border-color:rgba(248,113,113,0.25);
}

#layout{
    flex:1;
    display:flex;
    min-height:0;
}

#main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
}

#overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    opacity:0;
    pointer-events:none;
    transition:0.2s;
    z-index:20;
}

#overlay.show{
    opacity:1;
    pointer-events:auto;
}

#sidebar{
    position:fixed;
    top:0;
    left:0;
    height:100vh;
    width:320px;
    background:rgba(15,23,42,0.92);
    backdrop-filter:blur(14px);
    border-right:1px solid rgba(255,255,255,0.08);
    transform:translateX(-105%);
    transition:0.22s ease;
    z-index:30;
    display:flex;
    flex-direction:column;
}

#sidebar.open{
    transform:translateX(0);
}

.sideTop{
    padding:16px 16px 10px 16px;
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.sideTitle{
    flex:1;
    font-weight:800;
    letter-spacing:0.5px;
}

.sessionList{
    padding:12px;
    overflow:auto;
    flex:1;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.sessionItem{
    padding:12px;
    border-radius:12px;
    background:rgba(2,6,23,0.35);
    border:1px solid rgba(255,255,255,0.08);
    cursor:pointer;
    transition:0.2s;
}

.sessionItem:hover{
    transform:translateY(-1px);
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
}

.sessionMeta{
    display:flex;
    align-items:center;
    gap:10px;
}

.sessionTitle{
    flex:1;
    font-weight:700;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.sessionTime{
    font-size:12px;
    color:#94a3b8;
}

.sessionActions{
    margin-top:8px;
    display:flex;
    justify-content:flex-end;
}

.delBtn{
    padding:8px 10px;
    border-radius:10px;
    border:1px solid rgba(248,113,113,0.25);
    background:rgba(248,113,113,0.12);
    color:white;
    cursor:pointer;
    transition:0.2s;
}

.delBtn:hover{
    transform:translateY(-1px);
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
}

.sideBottom{
    padding:12px 16px 16px 16px;
    border-top:1px solid rgba(255,255,255,0.08);
}

.hint{
    font-size:12px;
    color:#94a3b8;
    line-height:1.35;
}

#chat{
    flex:1;
    overflow:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.message{
    max-width:65%;
    padding:12px 16px;
    border-radius:14px;
    font-size:15px;
    line-height:1.4;
    animation:fadeIn .25s ease;
    box-shadow:0 4px 15px rgba(0,0,0,0.25);
}

.user{
    background:linear-gradient(135deg,#3b82f6,#2563eb);
    margin-left:auto;
}

.ai{
    background:rgba(51,65,85,0.85);
    backdrop-filter:blur(8px);
}

#inputArea{
    display:flex;
    padding:15px;
    background:rgba(30,41,59,0.85);
    backdrop-filter:blur(10px);
    border-top:1px solid rgba(255,255,255,0.08);
}

input{
    flex:1;
    padding:12px 14px;
    font-size:16px;
    border:none;
    border-radius:8px;
    outline:none;
    background:#020617;
    color:white;
}

input::placeholder{
    color:#64748b;
}

button{
    margin-left:12px;
    padding:12px 22px;
    background:linear-gradient(135deg,#3b82f6,#2563eb);
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    transition:0.2s;
}

button:hover{
    transform:translateY(-1px);
    box-shadow:0 6px 18px rgba(59,130,246,0.4);
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(8px);} 
    to{opacity:1; transform:translateY(0);} 
}

@keyframes blink{
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}
.cursor{
  display:inline-block;
  margin-left:2px;
  animation: blink 1s steps(1) infinite;
  opacity:0.85;
}

.modelMenu{
    position:absolute;
    top:70px;
    right:140px;
    background:rgba(15,23,42,0.95);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:12px;
    backdrop-filter:blur(10px);
    display:none;
    flex-direction:column;
    overflow:hidden;
    z-index:99;
}

.modelMenu.show{
    display:flex;
}

.modelItem{
    padding:14px 20px;
    cursor:pointer;
    border-bottom:1px solid rgba(255,255,255,0.05);
    transition:0.2s;
}

.modelItem:hover{
    background:rgba(59,130,246,0.2);
}

.modelBadge{
    margin-left:10px;
    font-size:12px;
    padding:6px 10px;
    border-radius:999px;
    background:rgba(2,6,23,0.35);
    border:1px solid rgba(255,255,255,0.10);
    color:#e2e8f0;
}
.statusDot{
  width:10px;height:10px;border-radius:999px;display:inline-block;
  border:1px solid rgba(255,255,255,0.18);
  background:rgba(148,163,184,0.6);
}
.statusDot.ok{ background:rgba(34,197,94,0.85); }
.statusDot.bad{ background:rgba(239,68,68,0.85); }

.statusText{ font-size:12px; color:#cbd5e1; opacity:0.9; }

.sessionSearch{
  flex:1; padding:10px 12px; border-radius:10px;
  border:1px solid rgba(255,255,255,0.10);
  background:rgba(2,6,23,0.35); color:white; outline:none; font-size:13px;
}
.sessionSearch::placeholder{ color:#94a3b8; }

.sessionItem.active{
  border-color:rgba(59,130,246,0.45);
  box-shadow:0 10px 30px rgba(59,130,246,0.15);
}

.smallIconBtn{
  width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(2,6,23,0.35); color:white;
  border:1px solid rgba(255,255,255,0.10); border-radius:10px;
  cursor:pointer; transition:0.2s;
}
.smallIconBtn:hover{ transform:translateY(-1px); box-shadow:0 6px 18px rgba(0,0,0,0.25); }

.dayDivider{ margin:14px 0 6px; display:flex; justify-content:center; }
.dayDivider span{
  font-size:12px; color:#94a3b8;
  background:rgba(2,6,23,0.35);
  border:1px solid rgba(255,255,255,0.08);
  padding:6px 10px; border-radius:999px;
}

.msgTop{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; }
.msgTime{ font-size:11px; color:#cbd5e1; opacity:0.75; white-space:nowrap; }

.copyBtn{
  font-size:11px; padding:6px 8px; border-radius:10px;
  border:1px solid rgba(255,255,255,0.10);
  background:rgba(2,6,23,0.25); color:white; cursor:pointer; transition:0.2s;
}
.copyBtn:hover{ transform:translateY(-1px); }

#inputArea textarea{
  flex:1; resize:none;
  padding:12px 14px; font-size:16px;
  border:none; border-radius:8px; outline:none;
  background:#020617; color:white; line-height:1.35;
}
</style>
</head>

<body>

<header>
  <button class="iconBtn" id="menuBtn" title="历史">☰</button>
  <div class="title">🤖 益群的电子奴隶 
    <span id="modelBadge" class="modelBadge">弱智模式</span>
    <span id="statusDot" class="statusDot" title="连接状态"></span>
    <span id="statusText" class="statusText">检测中…</span>
  </div>
  <div class="headerActions">
    <button class="chipBtn" id="modelBtn" title="模型选择">模型</button>
    <button class="chipBtn" id="newChatBtn" title="新聊天">＋ 新聊天</button>
    <button class="chipBtn danger" id="clearBtn" title="清空当前">清空</button>
  </div>
</header>

<div id="modelMenu" class="modelMenu">
    <div class="modelItem" data-model="strong">益群大模型（最强）</div>
    <div class="modelItem" data-model="normal">益群睡觉模式（普通）</div>
    <div class="modelItem" data-model="cheap">弱智模式（最便宜）</div>
</div>

<div id="overlay"></div>

<div id="layout">
  <aside id="sidebar">
    <div class="sideTop">
      <div class="sideTitle">历史聊天</div>
      <input id="sessionSearch" class="sessionSearch" placeholder="搜索历史…" />
      <button class="iconBtn" id="closeSideBtn" title="关闭">✕</button>
    </div>
    <div id="sessionList" class="sessionList"></div>
    <div class="sideBottom">
      <div class="hint">提示：每次打开网页都会自动开始一个新聊天；旧聊天在这里。</div>
    </div>
  </aside>

  <main id="main">
    <div id="chat"></div>
  </main>
</div>

<div id="inputArea">
    <textarea id="input" rows="1" placeholder="输入消息...（Enter发送，Shift+Enter换行）"></textarea>
    <button id="sendBtn" type="button">发送</button>
</div>

<script>
// ======= 多会话存储（左侧历史） =======
const SESSIONS_KEY = "chatSessions";

function loadSessions(){
    return JSON.parse(localStorage.getItem(SESSIONS_KEY) || "[]");
}

function saveSessions(list){
    localStorage.setItem(SESSIONS_KEY, JSON.stringify(list));
}

function uid(){
    return "s_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
}

function fmtTime(ts){
    const d = new Date(ts);
    return d.toLocaleString();
}

let sessions = loadSessions();
let currentSessionId = null;
let history = []; // 当前页面显示的聊天（每次打开都会是新的）

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");
const sessionSearch = document.getElementById("sessionSearch");

const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const sessionListEl = document.getElementById("sessionList");

const menuBtn = document.getElementById("menuBtn");
const closeSideBtn = document.getElementById("closeSideBtn");
const clearBtn = document.getElementById("clearBtn");
const newChatBtn = document.getElementById("newChatBtn");
const modelBtn = document.getElementById("modelBtn");
const modelMenu = document.getElementById("modelMenu");
const modelItems = document.querySelectorAll(".modelItem");
const modelBadge = document.getElementById("modelBadge");

function getCurrentSession(){
    if(!currentSessionId) return null;
    return sessions.find(s => s.id === currentSessionId) || null;
}

function createNewSession(){
    // 规则：只创建当前聊天页面，不立刻写入左侧历史。
    // 只有当用户发出第一条消息时（role === "user"）才会创建并保存会话。
    currentSessionId = null;
    history = [];
    render();
    renderSessionList();
}

function openSession(id){
    const s = sessions.find(x=>x.id===id);
    if(!s) return;
    currentSessionId = s.id;
    history = Array.isArray(s.messages) ? s.messages.slice() : [];
    seenMessageIds.clear();
history.forEach(m => { if(m && m.id) seenMessageIds.add(m.id); });
    render();
    closeSidebar();
}

function deleteSession(id){
    sessions = sessions.filter(s=>s.id!==id);
    saveSessions(sessions);

    // 如果删的是当前会话，就立刻新建一个
    if(currentSessionId === id){
        createNewSession();
        return;
    }
    renderSessionList();
}

function syncCurrentToStorage(){
    // 没有会话 id（说明还没真正开始聊天），不写入历史
    if(!currentSessionId) return;

    const s = getCurrentSession();
    if(!s) return;
    s.messages = history.slice();

    // 自动用第一条用户消息当标题
    const firstUser = history.find(m=>m.role==="user" && m.text && m.text.trim());
    if(firstUser){
        s.title = firstUser.text.trim().slice(0, 24);
    }

    saveSessions(sessions);
    renderSessionList();
}

function renderSessionList(){
    if(!sessionListEl) return;
    sessionListEl.innerHTML = "";
    const q = (sessionSearch && sessionSearch.value ? sessionSearch.value : "").trim().toLowerCase();
const list = q ? sessions.filter(s => (s.title||"").toLowerCase().includes(q)) : sessions;

    if(!sessions.length){
        const empty = document.createElement("div");
        empty.className = "hint";
        empty.textContent = "暂无历史。";
        sessionListEl.appendChild(empty);
        return;
    }

    list.forEach(s=>{
        const item = document.createElement("div");
        item.className = "sessionItem";
        if(currentSessionId && s.id === currentSessionId) item.classList.add("active");

        const meta = document.createElement("div");
        meta.className = "sessionMeta";

        const t = document.createElement("div");
        t.className = "sessionTitle";
        t.textContent = s.title || "新聊天";

        const time = document.createElement("div");
        time.className = "sessionTime";
        time.textContent = fmtTime(s.createdAt);

        meta.appendChild(t);
        meta.appendChild(time);
        const rename = document.createElement("button");
rename.type = "button";
rename.className = "smallIconBtn";
rename.title = "重命名";
rename.textContent = "✎";
rename.addEventListener("click", (e)=>{
  e.stopPropagation();
  const next = prompt("给这个聊天起个名字：", s.title || "新聊天");
  if(!next) return;
  s.title = next.trim().slice(0, 40);
  saveSessions(sessions);
  renderSessionList();
});
meta.appendChild(rename);

        const actions = document.createElement("div");
        actions.className = "sessionActions";

        const del = document.createElement("button");
        del.className = "delBtn";
        del.textContent = "删除";
        del.addEventListener("click", (e)=>{
            e.stopPropagation();
            deleteSession(s.id);
        });

        actions.appendChild(del);

        item.appendChild(meta);
        item.appendChild(actions);

        item.addEventListener("click", ()=> openSession(s.id));
        sessionListEl.appendChild(item);
    });
}

function openSidebar(){
    sidebar.classList.add("open");
    overlay.classList.add("show");
}

function closeSidebar(){
    sidebar.classList.remove("open");
    overlay.classList.remove("show");
}

function msgId(){
  return "m_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
}
function pad2(n){ return String(n).padStart(2,"0"); }
function formatTime(ts){
  const d = new Date(ts);
  return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
function dayKey(ts){
  const d = new Date(ts);
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
}
function dayLabel(ts){
  const now = new Date();
  const dk = dayKey(ts);
  const today = dayKey(now.getTime());
  const y = new Date(now.getFullYear(), now.getMonth(), now.getDate()-1).getTime();
  const yesterday = dayKey(y);
  if(dk === today) return "今天";
  if(dk === yesterday) return "昨天";
  return dk;
}
function isNearBottom(el){
  return (el.scrollHeight - el.scrollTop - el.clientHeight) < 60;
}

let typingAbort = null;
let typingMessageId = null;
const seenMessageIds = new Set();
async function typeIntoMessage(targetMsgId, fullText){
  if(typingAbort) typingAbort.aborted = true;
  typingAbort = {aborted:false};

  const idx = history.findIndex(m=>m.id===targetMsgId);
  if(idx < 0) return;

  typingMessageId = targetMsgId;

  history[idx].text = "";
  syncCurrentToStorage();
  render();

  // 让速度肉眼可见：每次 1 个字符
  const speed = 28; // ms per char
  for(let i=0; i<fullText.length; i++){
    if(typingAbort.aborted){
      typingMessageId = null;
      render();
      return;
    }
    history[idx].text += fullText[i];

    // 每 6 个字符同步一次存储，减少 localStorage 压力
    if(i % 6 === 0) syncCurrentToStorage();

    render();
    await new Promise(r=>setTimeout(r, speed));
  }

  typingMessageId = null;
  syncCurrentToStorage();
  render();
}

function render(){
  const shouldStick = isNearBottom(chat);
  chat.innerHTML = "";

  let lastDay = null;

  history.forEach(m=>{
    const ts = m.ts || Date.now();
    const dk = dayKey(ts);
    if(dk !== lastDay){
      lastDay = dk;
      const divWrap = document.createElement("div");
      divWrap.className = "dayDivider";
      const pill = document.createElement("span");
      pill.textContent = dayLabel(ts);
      divWrap.appendChild(pill);
      chat.appendChild(divWrap);
    }

    const bubble = document.createElement("div");
    bubble.className = "message " + m.role;
    // 只让新消息做一次 fadeIn，打字机每次 render 不要反复变暗
if(m.id && seenMessageIds.has(m.id)){
  bubble.style.animation = "none";
}else{
  if(m.id) seenMessageIds.add(m.id);
}

    const top = document.createElement("div");
    top.className = "msgTop";

    const time = document.createElement("div");
    time.className = "msgTime";
    time.textContent = formatTime(ts);

    const copy = document.createElement("button");
    copy.className = "copyBtn";
    copy.type = "button";
    copy.textContent = "复制";
    copy.addEventListener("click", async (e)=>{
      e.stopPropagation();
      try{
        await navigator.clipboard.writeText(m.text || "");
        copy.textContent = "已复制";
        setTimeout(()=> copy.textContent = "复制", 900);
      }catch(err){
        copy.textContent = "复制失败";
        setTimeout(()=> copy.textContent = "复制", 900);
      }
    });

    top.appendChild(time);
    top.appendChild(copy);

    const content = document.createElement("div");
    let html = (m.text || "").replace(/\n/g,"<br>");
    if(m.role === "ai" && typingMessageId && m.id === typingMessageId){
      html += "<span class=\"cursor\">▍</span>";
    }
    content.innerHTML = html;

    bubble.appendChild(top);
    bubble.appendChild(content);
    chat.appendChild(bubble);
  });

  if(shouldStick){
    chat.scrollTop = chat.scrollHeight;
  }
}

function add(role,text){
    // 规则：只有当用户开始聊天（第一条 user 消息）时，才创建并保存一个会话到历史
    if(role === "user" && !currentSessionId){
        const s = {
            id: uid(),
            title: "新聊天",
            createdAt: Date.now(),
            messages: []
        };
        sessions.unshift(s);
        saveSessions(sessions);
        currentSessionId = s.id;
    }

    history.push({id: msgId(), role, text, ts: Date.now()});
    syncCurrentToStorage();
    render();
}

async function send(){
    const text = input.value.trim();
    if(!text) return;

    add("user",text);
    input.value = "";

    add("ai","正在思考...");
    const thinkMsg = history[history.length - 1];
if(thinkMsg && thinkMsg.id) seenMessageIds.add(thinkMsg.id);

    let reply = "";
    try{
        reply = await callAI(text);
    }catch(err){
        reply = "我连不上真正AI（" + err.message + "）。\n先用离线伪AI回复：" + (await fakeAI(text));
    }

    const last = history[history.length - 1];
if(last && last.role === "ai"){
  last.text = "";
  syncCurrentToStorage();
  render();
  await typeIntoMessage(last.id, reply);
} else {
  add("ai", reply);
}
}

function autoGrowTextarea(){
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
}
input.addEventListener("input", autoGrowTextarea);

input.addEventListener("keydown", (e)=>{
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    send();
  }
});

sendBtn.addEventListener("click", ()=> send());

// ======= 侧边栏与按钮事件 =======
menuBtn.addEventListener("click", ()=>{
    renderSessionList();
    openSidebar();
});
closeSideBtn.addEventListener("click", closeSidebar);
overlay.addEventListener("click", closeSidebar);
if(sessionSearch){
  sessionSearch.addEventListener("input", ()=> renderSessionList());
}

newChatBtn.addEventListener("click", ()=>{
    createNewSession();
});

clearBtn.addEventListener("click", ()=>{
    // 清空当前会话消息
    history = [];
    seenMessageIds.clear();

    // 如果当前会话曾经保存过（有 id），清空后就把它从历史删掉，避免出现空会话
    if(currentSessionId){
        sessions = sessions.filter(s=>s.id !== currentSessionId);
        saveSessions(sessions);
    }

    // 回到一个全新的“未保存”聊天
    currentSessionId = null;
    renderSessionList();
    render();
});

// ======= AI 逻辑 =======
// 默认用“伪AI”方便你本地先跑通；把 USE_REAL_AI 改成 true 就会走后端转发到真正AI。
const USE_REAL_AI = true; // ✅ 想接入真正AI：改成 true，并启动下面我给你的 server.js
const BACKEND_URL = "http://172.16.240.207:8787/api/chat"; // 后端地址（你可以改端口）

async function checkBackend(){
  // 如果页面元素还没准备好，懒加载获取
  const dot = document.getElementById("statusDot");
  const text = document.getElementById("statusText");
  if(!dot || !text) return;

  const pingUrl = BACKEND_URL.replace(/\/api\/chat$/, "/api/ping");
  console.log("[ping] GET", pingUrl);

  // 先显示检测中
  text.textContent = "检测中…";
  dot.classList.remove("ok","bad");

  const ctrl = new AbortController();
  const timer = setTimeout(()=> ctrl.abort(), 1800);

  try{
    const r = await fetch(pingUrl, { method: "GET", signal: ctrl.signal });
    clearTimeout(timer);

    if(r.ok){
      dot.classList.add("ok");
      dot.classList.remove("bad");
      text.textContent = "在线";
    }else{
      dot.classList.add("bad");
      dot.classList.remove("ok");
      text.textContent = "后端异常";
    }
  }catch(e){
    clearTimeout(timer);
    dot.classList.add("bad");
    dot.classList.remove("ok");
    text.textContent = "离线";
  }
}

// 旧聊天只在左侧历史里，不会出现在当前页面
createNewSession();
checkBackend();
setInterval(checkBackend, 5000);
autoGrowTextarea();

async function callAI(msg){
    if(!USE_REAL_AI) return fakeAI(msg);

    let selectedModel = "gpt-5.1";

    if(currentModelMode === "normal"){
        selectedModel = "gpt-5-mini";
    }

    if(currentModelMode === "cheap"){
        selectedModel = "gpt-5-nano";
    }

    console.log("[callAI] mode=", currentModelMode, "selectedModel=", selectedModel);

    const r = await fetch(BACKEND_URL, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ 
            message: msg, 
            history,
            model: selectedModel,
            mode: currentModelMode
        })
    });

    if(!r.ok){
        const t = await r.text().catch(()=>"");
        throw new Error("后端错误：" + r.status + " " + t);
    }

    const data = await r.json();
    return data.reply || "(没有返回内容)";
}

// 伪AI：不需要任何Key，离线可用
async function fakeAI(msg){
    await new Promise(r=>setTimeout(r,800));

    if(msg.includes("你好"))
        return "你好呀 👋";

    if(msg.includes("你是谁"))
        return "我是你写的AI助手 😎";

    if(msg.includes("时间"))
        return "现在时间是 " + new Date().toLocaleTimeString();

    if(msg.includes("笑话"))
        return "程序员为什么分不清圣诞节和万圣节？因为 Oct 31 == Dec 25";

    return "你说的是：" + msg;
}
