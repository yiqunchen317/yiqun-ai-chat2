<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>益群的电子奴隶</title>

<style>
body{
    margin:0;
    background:linear-gradient(135deg,#0f172a,#020617);
    color:white;
    font-family:"Segoe UI",Arial;
    display:flex;
    flex-direction:column;
    height:100vh;
}

header{
    padding:18px;
    background:rgba(30,41,59,0.8);
    backdrop-filter:blur(10px);
    font-size:22px;
    font-weight:bold;
    letter-spacing:1px;
    border-bottom:1px solid rgba(255,255,255,0.08);
}

header{
    display:flex;
    align-items:center;
    gap:12px;
}

.title{
    flex:1;
    display:flex;
    align-items:center;
    gap:10px;
}

.headerActions{
    display:flex;
    align-items:center;
    gap:10px;
}

.iconBtn{
    width:42px;
    height:42px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:rgba(2,6,23,0.35);
    color:white;
    border:1px solid rgba(255,255,255,0.10);
    border-radius:10px;
    cursor:pointer;
    transition:0.2s;
}

.iconBtn:hover{
    transform:translateY(-1px);
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
}

.chipBtn{
    padding:10px 14px;
    background:rgba(2,6,23,0.35);
    border:1px solid rgba(255,255,255,0.10);
    color:white;
    border-radius:999px;
    cursor:pointer;
    font-weight:600;
    transition:0.2s;
}

.chipBtn:hover{
    transform:translateY(-1px);
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
}

.chipBtn.danger{
    border-color:rgba(248,113,113,0.25);
}

#layout{
    flex:1;
    display:flex;
    min-height:0;
}

#main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
}

#overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    opacity:0;
    pointer-events:none;
    transition:0.2s;
    z-index:20;
}

#overlay.show{
    opacity:1;
    pointer-events:auto;
}

#sidebar{
    position:fixed;
    top:0;
    left:0;
    height:100vh;
    width:320px;
    background:rgba(15,23,42,0.92);
    backdrop-filter:blur(14px);
    border-right:1px solid rgba(255,255,255,0.08);
    transform:translateX(-105%);
    transition:0.22s ease;
    z-index:30;
    display:flex;
    flex-direction:column;
}

#sidebar.open{
    transform:translateX(0);
}

.sideTop{
    padding:16px 16px 10px 16px;
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.sideTitle{
    flex:1;
    font-weight:800;
    letter-spacing:0.5px;
}

.sessionList{
    padding:12px;
    overflow:auto;
    flex:1;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.sessionItem{
    padding:12px;
    border-radius:12px;
    background:rgba(2,6,23,0.35);
    border:1px solid rgba(255,255,255,0.08);
    cursor:pointer;
    transition:0.2s;
}

.sessionItem:hover{
    transform:translateY(-1px);
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
}

.sessionMeta{
    display:flex;
    align-items:center;
    gap:10px;
}

.sessionTitle{
    flex:1;
    font-weight:700;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.sessionTime{
    font-size:12px;
    color:#94a3b8;
}

.sessionActions{
    margin-top:8px;
    display:flex;
    justify-content:flex-end;
}

.delBtn{
    padding:8px 10px;
    border-radius:10px;
    border:1px solid rgba(248,113,113,0.25);
    background:rgba(248,113,113,0.12);
    color:white;
    cursor:pointer;
    transition:0.2s;
}

.delBtn:hover{
    transform:translateY(-1px);
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
}

.sideBottom{
    padding:12px 16px 16px 16px;
    border-top:1px solid rgba(255,255,255,0.08);
}

.hint{
    font-size:12px;
    color:#94a3b8;
    line-height:1.35;
}

#chat{
    flex:1;
    overflow:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.message{
    max-width:65%;
    padding:12px 16px;
    border-radius:14px;
    font-size:15px;
    line-height:1.4;
    animation:fadeIn .25s ease;
    box-shadow:0 4px 15px rgba(0,0,0,0.25);
}

.user{
    background:linear-gradient(135deg,#3b82f6,#2563eb);
    margin-left:auto;
}

.ai{
    background:rgba(51,65,85,0.85);
    backdrop-filter:blur(8px);
}

#inputArea{
    display:flex;
    padding:15px;
    background:rgba(30,41,59,0.85);
    backdrop-filter:blur(10px);
    border-top:1px solid rgba(255,255,255,0.08);
}

input{
    flex:1;
    padding:12px 14px;
    font-size:16px;
    border:none;
    border-radius:8px;
    outline:none;
    background:#020617;
    color:white;
}

input::placeholder{
    color:#64748b;
}

button{
    margin-left:12px;
    padding:12px 22px;
    background:linear-gradient(135deg,#3b82f6,#2563eb);
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    transition:0.2s;
}

button:hover{
    transform:translateY(-1px);
    box-shadow:0 6px 18px rgba(59,130,246,0.4);
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(8px);} 
    to{opacity:1; transform:translateY(0);} 
}

@keyframes blink{
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}
.cursor{
  display:inline-block;
  margin-left:2px;
  animation: blink 1s steps(1) infinite;
  opacity:0.85;
}

.modelMenu{
    position:absolute;
    top:70px;
    right:140px;
    background:rgba(15,23,42,0.95);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:12px;
    backdrop-filter:blur(10px);
    display:none;
    flex-direction:column;
    overflow:hidden;
    z-index:99;
}

.modelMenu.show{
    display:flex;
}

.modelItem{
    padding:14px 20px;
    cursor:pointer;
    border-bottom:1px solid rgba(255,255,255,0.05);
    transition:0.2s;
}

.modelItem:hover{
    background:rgba(59,130,246,0.2);
}

.modelBadge{
    margin-left:10px;
    font-size:12px;
    padding:6px 10px;
    border-radius:999px;
    background:rgba(2,6,23,0.35);
    border:1px solid rgba(255,255,255,0.10);
    color:#e2e8f0;
}
.statusDot{
  width:10px;height:10px;border-radius:999px;display:inline-block;
  border:1px solid rgba(255,255,255,0.18);
  background:rgba(148,163,184,0.6);
}
.statusDot.ok{ background:rgba(34,197,94,0.85); }
.statusDot.bad{ background:rgba(239,68,68,0.85); }

.statusText{ font-size:12px; color:#cbd5e1; opacity:0.9; }

.sessionSearch{
  flex:1; padding:10px 12px; border-radius:10px;
  border:1px solid rgba(255,255,255,0.10);
  background:rgba(2,6,23,0.35); color:white; outline:none; font-size:13px;
}
.sessionSearch::placeholder{ color:#94a3b8; }

.sessionItem.active{
  border-color:rgba(59,130,246,0.45);
  box-shadow:0 10px 30px rgba(59,130,246,0.15);
}

.smallIconBtn{
  width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(2,6,23,0.35); color:white;
  border:1px solid rgba(255,255,255,0.10); border-radius:10px;
  cursor:pointer; transition:0.2s;
}
.smallIconBtn:hover{ transform:translateY(-1px); box-shadow:0 6px 18px rgba(0,0,0,0.25); }

.dayDivider{ margin:14px 0 6px; display:flex; justify-content:center; }
.dayDivider span{
  font-size:12px; color:#94a3b8;
  background:rgba(2,6,23,0.35);
  border:1px solid rgba(255,255,255,0.08);
  padding:6px 10px; border-radius:999px;
}

.msgTop{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; }
.msgTime{ font-size:11px; color:#cbd5e1; opacity:0.75; white-space:nowrap; }

.copyBtn{
  font-size:11px; padding:6px 8px; border-radius:10px;
  border:1px solid rgba(255,255,255,0.10);
  background:rgba(2,6,23,0.25); color:white; cursor:pointer; transition:0.2s;
}
.copyBtn:hover{ transform:translateY(-1px); }

#inputArea textarea{
  flex:1; resize:none;
  padding:12px 14px; font-size:16px;
  border:none; border-radius:8px; outline:none;
  background:#020617; color:white; line-height:1.35;
}
/* ===== 图片生成弹窗 ===== */
#imgModal{
  position:fixed; inset:0;
  display:none; align-items:center; justify-content:center;
  z-index:120;
}
#imgModal.show{ display:flex; }
#imgModal .backdrop{ position:absolute; inset:0; background:rgba(0,0,0,0.55); }
#imgModal .panel{
  position:relative;
  width:min(680px, calc(100vw - 32px));
  background:rgba(15,23,42,0.96);
  border:1px solid rgba(255,255,255,0.10);
  border-radius:16px;
  backdrop-filter:blur(14px);
  box-shadow:0 22px 60px rgba(0,0,0,0.45);
  padding:16px;
}
#imgModal .panel h3{ margin:0 0 10px; font-size:16px; }
#imgModal textarea{
  width:100%; min-height:110px; resize:vertical;
  padding:12px 14px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.10);
  background:rgba(2,6,23,0.55);
  color:white; outline:none;
  line-height:1.35; font-size:14px;
}
#imgModal .row{ display:flex; gap:10px; justify-content:flex-end; margin-top:12px; }
#imgModal .row .chipBtn{ margin-left:0; }
#imgModal .muted{ margin-top:8px; font-size:12px; color:#94a3b8; line-height:1.35; }

/* ===== 聊天气泡图片展示 ===== */
.msgImg{
  display:block;
  max-width:100%;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.10);
  margin-top:8px;
}
.imgCaption{ margin-top:8px; font-size:13px; color:#e2e8f0; line-height:1.35; }
</style>
</head>

<body>

<header>
  <button class="iconBtn" id="menuBtn" title="历史">☰</button>
  <div class="title">🤖 益群的电子奴隶 
    <span id="modelBadge" class="modelBadge">弱智模式</span>
    <span id="statusDot" class="statusDot" title="连接状态"></span>
    <span id="statusText" class="statusText">检测中…</span>
  </div>
  <div class="headerActions">
    <button class="chipBtn" id="modelBtn" title="模型选择">模型</button>
    <button class="chipBtn" id="imageBtn" title="生成图片">🖼 图片</button>
    <button class="chipBtn" id="newChatBtn" title="新聊天">＋ 新聊天</button>
    <button class="chipBtn danger" id="clearBtn" title="清空当前">清空</button>
  </div>
</header>

<div id="modelMenu" class="modelMenu">
    <div class="modelItem" data-model="strong">益群大模型（最强）</div>
    <div class="modelItem" data-model="normal">益群睡觉模式（普通）</div>
    <div class="modelItem" data-model="cheap">弱智模式（最便宜）</div>
    <div class="modelItem" data-model="infinity">无尽模型（慎试）</div>
</div>

<div id="overlay"></div>
<div id="imgModal">
    <div class="backdrop" id="imgModalBackdrop"></div>
    <div class="panel">
      <h3>生成图片</h3>
      <textarea id="imgPrompt" placeholder="描述你想要的图片，比如：
  一只戴墨镜的橘猫，赛博朋克霓虹灯，高清，电影感"></textarea>
      <div class="muted">会调用后端接口 <b>/api/image</b>（同端口 127.0.0.1:8787）。</div>
      <div class="row">
        <button class="chipBtn danger" id="imgCancelBtn" type="button">取消</button>
        <button class="chipBtn" id="imgGenBtn" type="button">生成</button>
      </div>
    </div>
  </div>

<div id="layout">
  <aside id="sidebar">
    <div class="sideTop">
      <div class="sideTitle">历史聊天</div>
      <input id="sessionSearch" class="sessionSearch" placeholder="搜索历史…" />
      <button class="iconBtn" id="closeSideBtn" title="关闭">✕</button>
    </div>
    <div id="sessionList" class="sessionList"></div>
    <div class="sideBottom">
      <div class="hint">提示：每次打开网页都会自动开始一个新聊天；旧聊天在这里。</div>
    </div>
  </aside>

  <main id="main">
    <div id="chat"></div>
  </main>
</div>

<div id="inputArea">
    <textarea id="input" rows="1" placeholder="输入消息...（Enter发送，Shift+Enter换行）"></textarea>
    <button id="sendBtn" type="button">发送</button>
</div>

<script>
// ======= 多会话存储（左侧历史） =======
const SESSIONS_KEY = "chatSessions";

function loadSessions(){
    return JSON.parse(localStorage.getItem(SESSIONS_KEY) || "[]");
}

function saveSessions(list){
    localStorage.setItem(SESSIONS_KEY, JSON.stringify(list));
}

function uid(){
    return "s_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
}

function fmtTime(ts){
    const d = new Date(ts);
    return d.toLocaleString();
}

let sessions = loadSessions();
let currentSessionId = null;
let history = []; // 当前页面显示的聊天（每次打开都会是新的）
let isSending = false; // 防止同一条消息被重复发送（例如 Enter 触发两次）

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");
const sessionSearch = document.getElementById("sessionSearch");

const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const sessionListEl = document.getElementById("sessionList");

const menuBtn = document.getElementById("menuBtn");
const closeSideBtn = document.getElementById("closeSideBtn");
const clearBtn = document.getElementById("clearBtn");
const newChatBtn = document.getElementById("newChatBtn");
const modelBtn = document.getElementById("modelBtn");
const modelMenu = document.getElementById("modelMenu");
const modelItems = document.querySelectorAll(".modelItem");
const modelBadge = document.getElementById("modelBadge");
// ======= 图片弹窗 DOM =======
const imageBtn = document.getElementById("imageBtn");
const imgModal = document.getElementById("imgModal");
const imgModalBackdrop = document.getElementById("imgModalBackdrop");
const imgPrompt = document.getElementById("imgPrompt");
const imgGenBtn = document.getElementById("imgGenBtn");
const imgCancelBtn = document.getElementById("imgCancelBtn");

function getCurrentSession(){
    if(!currentSessionId) return null;
    return sessions.find(s => s.id === currentSessionId) || null;
}

function createNewSession(){
    // 规则：只创建当前聊天页面，不立刻写入左侧历史。
    // 只有当用户发出第一条消息时（role === "user"）才会创建并保存会话。
    currentSessionId = null;
    history = [];
    render();
    renderSessionList();
}

function openSession(id){
    const s = sessions.find(x=>x.id===id);
    if(!s) return;
    currentSessionId = s.id;
    history = Array.isArray(s.messages) ? s.messages.slice() : [];
    // 兼容旧数据：补上 mode 字段，避免上下文过滤出错
history = history.map(m => {
  if(!m || typeof m !== "object") return m;
  if(!m.mode) m.mode = "cheap";
  return m;
});
    seenMessageIds.clear();
history.forEach(m => { if(m && m.id) seenMessageIds.add(m.id); });
    render();
    closeSidebar();
}

function deleteSession(id){
    sessions = sessions.filter(s=>s.id!==id);
    saveSessions(sessions);

    // 如果删的是当前会话，就立刻新建一个
    if(currentSessionId === id){
        createNewSession();
        return;
    }
    renderSessionList();
}

function syncCurrentToStorage(){
    // 没有会话 id（说明还没真正开始聊天），不写入历史
    if(!currentSessionId) return;

    const s = getCurrentSession();
    if(!s) return;
    s.messages = history.slice();

    // 自动用第一条用户消息当标题
    const firstUser = history.find(m=>m.role==="user" && m.text && m.text.trim());
    if(firstUser){
        s.title = firstUser.text.trim().slice(0, 24);
    }

    saveSessions(sessions);
    renderSessionList();
}

function renderSessionList(){
    if(!sessionListEl) return;
    sessionListEl.innerHTML = "";
    const q = (sessionSearch && sessionSearch.value ? sessionSearch.value : "").trim().toLowerCase();
const list = q ? sessions.filter(s => (s.title||"").toLowerCase().includes(q)) : sessions;

    if(!sessions.length){
        const empty = document.createElement("div");
        empty.className = "hint";
        empty.textContent = "暂无历史。";
        sessionListEl.appendChild(empty);
        return;
    }

    list.forEach(s=>{
        const item = document.createElement("div");
        item.className = "sessionItem";
        if(currentSessionId && s.id === currentSessionId) item.classList.add("active");

        const meta = document.createElement("div");
        meta.className = "sessionMeta";

        const t = document.createElement("div");
        t.className = "sessionTitle";
        t.textContent = s.title || "新聊天";

        const time = document.createElement("div");
        time.className = "sessionTime";
        time.textContent = fmtTime(s.createdAt);

        meta.appendChild(t);
        meta.appendChild(time);
        const rename = document.createElement("button");
rename.type = "button";
rename.className = "smallIconBtn";
rename.title = "重命名";
rename.textContent = "✎";
rename.addEventListener("click", (e)=>{
  e.stopPropagation();
  const next = prompt("给这个聊天起个名字：", s.title || "新聊天");
  if(!next) return;
  s.title = next.trim().slice(0, 40);
  saveSessions(sessions);
  renderSessionList();
});
meta.appendChild(rename);

        const actions = document.createElement("div");
        actions.className = "sessionActions";

        const del = document.createElement("button");
        del.className = "delBtn";
        del.textContent = "删除";
        del.addEventListener("click", (e)=>{
            e.stopPropagation();
            deleteSession(s.id);
        });

        actions.appendChild(del);

        item.appendChild(meta);
        item.appendChild(actions);

        item.addEventListener("click", ()=> openSession(s.id));
        sessionListEl.appendChild(item);
    });
}

function openSidebar(){
    sidebar.classList.add("open");
    overlay.classList.add("show");
}

function closeSidebar(){
    sidebar.classList.remove("open");
    overlay.classList.remove("show");
}

function msgId(){
  return "m_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
}
function pad2(n){ return String(n).padStart(2,"0"); }
function formatTime(ts){
  const d = new Date(ts);
  return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
function dayKey(ts){
  const d = new Date(ts);
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
}
function dayLabel(ts){
  const now = new Date();
  const dk = dayKey(ts);
  const today = dayKey(now.getTime());
  const y = new Date(now.getFullYear(), now.getMonth(), now.getDate()-1).getTime();
  const yesterday = dayKey(y);
  if(dk === today) return "今天";
  if(dk === yesterday) return "昨天";
  return dk;
}
function isNearBottom(el){
  return (el.scrollHeight - el.scrollTop - el.clientHeight) < 60;
}

let typingAbort = null;
let typingMessageId = null;
const seenMessageIds = new Set();
function escapeHtml(s){
  return String(s ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/\"/g,"&quot;")
    .replace(/'/g,"&#39;");
}
async function typeIntoMessage(targetMsgId, fullText){
  if(typingAbort) typingAbort.aborted = true;
  typingAbort = {aborted:false};

  const idx = history.findIndex(m=>m.id===targetMsgId);
  if(idx < 0) return;

  typingMessageId = targetMsgId;

  history[idx].text = "";
  syncCurrentToStorage();
  render();

  // 让速度肉眼可见：每次 1 个字符
  const speed = 28; // ms per char
  for(let i=0; i<fullText.length; i++){
    if(typingAbort.aborted){
      typingMessageId = null;
      render();
      return;
    }
    history[idx].text += fullText[i];

    // 每 6 个字符同步一次存储，减少 localStorage 压力
    if(i % 6 === 0) syncCurrentToStorage();

    render();
    await new Promise(r=>setTimeout(r, speed));
  }

  typingMessageId = null;
  syncCurrentToStorage();
  render();
}
// ======= 流式输出：直接追加（去掉“顺滑打字机队列”，避免重合/重复） =======
let streamLastRenderAt = 0;

function appendTextToMessage(msgId, text){
  if(!msgId || !text) return;
  const idx = history.findIndex(m => m && m.id === msgId);
  if(idx < 0) return;

  history[idx].text = String(history[idx].text || "") + String(text);

  // 节流：不要每个 token 都 render / 写 localStorage
  if((history[idx].text.length % 80) === 0) syncCurrentToStorage();

  const now = Date.now();
  if(now - streamLastRenderAt > 30){
    streamLastRenderAt = now;
    render();
  }
}

function appendDeltaToLastAI(delta){
  if(!delta) return;
  const last = history[history.length - 1];
  if(!last || last.role !== "ai") return;

  const d = String(delta);

async function send(){
    if(isSending) return;
    isSending = true;
    sendBtn.disabled = true;
    input.disabled = true;
    const text = input.value.trim();
    if(!text) {
        isSending = false;
        sendBtn.disabled = false;
        input.disabled = false;
        return;
    }
    const modeAtSend = currentModelMode; // 锁定本次请求使用的模式，避免中途切换导致串模式
// ===== 图片指令：/img 或 /图 =====
if(/^\/(img|图)\s+/i.test(text)){
    const prompt = text.replace(/^\/(img|图)\s+/i, "").trim();

    // 按当前模式记录用户消息
    const prevModeCmd = currentModelMode;
    currentModelMode = modeAtSend;
    add("user", text);
    currentModelMode = prevModeCmd;
    input.value = "";

    // 占位
    const prevMode2 = currentModelMode;
    currentModelMode = modeAtSend;
    add("ai","正在生成图片…");
    currentModelMode = prevMode2;

    const placeholder = history[history.length - 1];

    try{
      const r = await fetch(IMAGE_URL, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          prompt,
          mode: modeAtSend,
          model: (modeAtSend === "infinity") ? "grok-imagine-image" : "gpt-image-1"
        })
      });

      if(!r.ok){
        const t = await r.text().catch(()=> "");
        throw new Error(r.status + " " + t);
      }

      const data = await r.json().catch(()=> ({}));
      const img = (data && typeof data.image === "string") ? data.image.trim() : "";

      if(!img) throw new Error("后端没有返回 image 字段");

      // 用图片替换占位
      placeholder.text = prompt;
      placeholder.image = img;

      syncCurrentToStorage();
      render();

    }catch(err){
      placeholder.text = "图片生成失败：" + (err.message || String(err));
      syncCurrentToStorage();
      render();
    }

    // 释放发送锁
    isSending = false;
    sendBtn.disabled = false;
    input.disabled = false;
    input.focus();
    return;
}

    // 用锁定模式写入消息（避免发送后马上切模式造成这条消息被标到新模式）
    const prevMode = currentModelMode;
    currentModelMode = modeAtSend;
    add("user",text);
    currentModelMode = prevMode;
    input.value = "";

    // “正在思考...”也归属本次锁定模式
    const prevMode2 = currentModelMode;
    currentModelMode = modeAtSend;
    add("ai","正在思考...");
    currentModelMode = prevMode2;
    const thinkMsg = history[history.length - 1];
    if(thinkMsg && thinkMsg.id) seenMessageIds.add(thinkMsg.id);

    let reply = "";
    try{
        reply = await callAI(text, modeAtSend);
    }catch(err){
        reply = "我连不上真正AI（" + err.message + "）。\n先用离线伪AI回复：" + (await fakeAI(text));
    }

    const last = history[history.length - 1];
if(last && last.role === "ai"){
  // ✅ 流式时 reply 过程中已经逐步写入；这里兜底：如果还没写入任何内容，就一次性填上
  const cur = String(last.text || "").trim();
  if(!cur || cur === "正在思考..." || cur === "..." || cur === "…"){
    last.text = reply;
  }
  // 结束：去掉光标
  // 收尾：把队列内容全部打完后再最终同步一次（如果还在打字就稍后会同步）
  typingMessageId = null;
  syncCurrentToStorage();
  render();
} else {
  add("ai", reply);
  // 收尾：把队列内容全部打完后再最终同步一次（如果还在打字就稍后会同步）
  typingMessageId = null;
  syncCurrentToStorage();
  render();
}

    // 释放发送锁
    isSending = false;
    sendBtn.disabled = false;
    input.disabled = false;
    input.focus();
}

}

function buildContextWindow(){
  // 严格规则：只读取“当前页面聊天框”里可见的消息（history）作为上下文
  // 不读取左侧历史、localStorage 其它会话、其它页面、其它模式等任何东西
  const trimmed = history
    .filter(m => m && (m.role === "user" || m.role === "ai"))
    .filter(m => m.text && String(m.text).trim())
    .slice(-MAX_CONTEXT_MESSAGES);

  // 如果最后一条是“正在思考...”，不要把它发给后端
  if(trimmed.length && trimmed[trimmed.length - 1].role === "ai"){
    const t = String(trimmed[trimmed.length - 1].text || "").trim();
    if(t === "正在思考..." || t === "…" || t === "...") trimmed.pop();
  }

  return trimmed;
}

async function checkBackend(){
  // 如果页面元素还没准备好，懒加载获取
  const dot = document.getElementById("statusDot");
  const text = document.getElementById("statusText");
  if(!dot || !text) return;

  const pingUrl = BACKEND_URL.replace(/\/api\/chat$/, "/api/ping");
  console.log("[ping] GET", pingUrl);

  // 先显示检测中
  text.textContent = "检测中…";
  dot.classList.remove("ok","bad");

  const ctrl = new AbortController();
  const timer = setTimeout(()=> ctrl.abort(), 1800);

  try{
    const r = await fetch(pingUrl, { method: "GET", signal: ctrl.signal });
    clearTimeout(timer);

    if(r.ok){
      dot.classList.add("ok");
      dot.classList.remove("bad");
      text.textContent = "在线";
    }else{
      dot.classList.add("bad");
      dot.classList.remove("ok");
      text.textContent = "后端异常";
    }
  }catch(e){
    clearTimeout(timer);
    dot.classList.add("bad");
    dot.classList.remove("ok");
    text.textContent = "离线";
  }
}

// ======= 页面初始化：每次打开都自动开始一个新聊天 =======
// 旧聊天只在左侧历史里，不会出现在当前页面
createNewSession();
checkBackend();
setInterval(checkBackend, 5000);
autoGrowTextarea();

async function callAI(msg, modeLocked = currentModelMode){
    if(!USE_REAL_AI) return fakeAI(msg);

    let selectedModel = "gpt-5.1";

    if(modeLocked === "normal"){
        selectedModel = "gpt-5-mini";
    }

    if(modeLocked === "cheap"){
        selectedModel = "gpt-5-nano";
    }

    if(modeLocked === "infinity"){
        // 不要写 grok-2-latest（很多 key 没权限会 404）。交给后端 resolver 也行，这里先用更通用的 grok-2。
        selectedModel = "grok-2";
    }

    console.log("[callAI] mode=", modeLocked, "selectedModel=", selectedModel);
    try{
      const ctx = buildContextWindow();
      const lastUser = [...ctx].reverse().find(m => m && m.role === "user");
      console.log("[callAI] ctx_len=", ctx.length, "last_user=", lastUser ? lastUser.text : "(none)");
    }catch(e){
      console.log("[callAI] ctx_debug_error", e);
    }

    const payloadHistory = [
      { role: "system", text: getSystemPromptForMode(modeLocked) },
      ...(isRuleProbe(msg) ? [{ role: "system", text: ruleProbeGuardText() }] : []),
      ...buildContextWindow()
    ];
    // 兼容多数后端/模型：assistant 角色名通常必须是 "assistant"，不要用 "ai"
    const normalizedHistory = payloadHistory.map(m => {
      if(!m || typeof m !== "object") return m;
      const r = m.role;
      return {
        ...m,
        role: (r === "ai") ? "assistant" : r
      };
    });

    // ===== 调试：确认前端到底发了几条同样的用户消息 =====
    try{
      const lastUserText = (payloadHistory.slice().reverse().find(m => m && m.role === "user" && m.text) || {}).text;
      const sameCount = lastUserText
        ? payloadHistory.filter(m => m && m.role === "user" && String(m.text).trim() === String(lastUserText).trim()).length
        : 0;
      console.log("[callAI] payload_history_len=", payloadHistory.length, "same_last_user_count=", sameCount, "last_user=", lastUserText);
      // 如需看全量内容，打开下面这行：
      // console.log("[callAI] payload_history=", payloadHistory.map(m => ({role:m.role, text:(m.text||"").slice(0,80)})));
    }catch(e){
      console.log("[callAI] payload_debug_error", e);
    }
    const payload = {
      history: normalizedHistory,
      model: selectedModel,
      mode: modeLocked,
      stream: true
    };

    const r = await fetch(BACKEND_URL, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
    });

    if(!r.ok){
        const t = await r.text().catch(()=>"");
        throw new Error("后端错误：" + r.status + " " + t);
    }

    const ct = (r.headers.get("content-type") || "").toLowerCase();

// ✅ 流式：边读边显示（兼容更多 SSE 格式）
if(ct.includes("text/event-stream")){
  const reader = r.body.getReader();
  const decoder = new TextDecoder("utf-8");
  let buffer = "";
  let full = "";
  let gotAny = false;

  while(true){
    const { value, done } = await reader.read();
    if(done) break;

    buffer += decoder.decode(value, { stream: true });

    // SSE 每条事件用空行分隔（兼容 \r\n\r\n）
    const parts = buffer.split(/\r?\n\r?\n/);
    buffer = parts.pop() || "";

    for(const part of parts){
      const rawLines = part.split(/\r?\n/);
      const lines = rawLines.map(s=>s.trim()).filter(Boolean);
      if(!lines.length) continue;

      // 忽略 SSE 注释行，如 :ok
      if(lines.length === 1 && lines[0].startsWith(":")) continue;

      const isDone = lines.some(l => l.startsWith("event:") && /done/i.test(l));
      const isError = lines.some(l => l.startsWith("event:") && /error/i.test(l));

      // 一个事件里可能有多行 data:
      const dataLines = lines.filter(l => l.startsWith("data:"));
      if(!dataLines.length){
        if(isDone) continue;
        // 没 data 的事件就跳过
        continue;
      }

      const dataStr = dataLines.map(l => l.slice(5).trim()).join("\n");

      // done 事件：结束但不丢最后的 data（有些实现会带 data: {})
      if(isDone){
        continue;
      }

      // 先尝试按 JSON 解析
      let parsed = null;
      try{ parsed = JSON.parse(dataStr); }catch(_e){ parsed = null; }

      // 1) 标准：{delta:"..."}
      if(parsed && typeof parsed.delta === "string" && parsed.delta.length){
        gotAny = true;
        full += parsed.delta;
        appendDeltaToLastAI(parsed.delta);
        continue;
      }

      // 2) 错误事件：{message:"..."}
      if(isError && parsed && typeof parsed.message === "string" && parsed.message.length){
        const msg = "[后端错误] " + parsed.message;
        gotAny = true;
        full += msg;
        appendDeltaToLastAI(msg);
        continue;
      }

      // 3) 兜底：把 data 当纯文本 delta（有些后端会直接 data: hello）
      if(dataStr && String(dataStr).trim()){
        const textDelta = String(dataStr);
        gotAny = true;
        full += textDelta;
        appendDeltaToLastAI(textDelta);
        continue;
      }
    }
  }

  syncCurrentToStorage();
  return (gotAny && String(full).trim()) ? full : "(没有返回内容)";
}

// 非流式：保持原来 JSON
const data = await r.json();
return data.reply || "(没有返回内容)";
}

// 伪AI：不需要任何Key，离线可用
async function fakeAI(msg){
    await new Promise(r=>setTimeout(r,800));

    if(msg.includes("你好"))
        return "你好呀 👋";

    if(msg.includes("你是谁"))
        return "我是益群开发并集成的聊天助手 😎";

    if(msg.includes("时间"))
        return "现在时间是 " + new Date().toLocaleTimeString();

    if(msg.includes("笑话"))
        return "程序员为什么分不清圣诞节和万圣节？因为 Oct 31 == Dec 25";

    return "你说的是：" + msg;
}
