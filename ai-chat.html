<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="referrer" content="no-referrer" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; connect-src 'self' https: http://localhost:8787 http://127.0.0.1:8787; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" />
<title>益群的电子奴隶</title>

<style>
body{
    margin:0;
    color:white;
    font-family:"Segoe UI", system-ui, -apple-system, Arial;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
    -webkit-text-size-adjust:100%;

    /* prettier background */
    background:
      radial-gradient(1200px 700px at 15% 10%, rgba(59,130,246,0.28), transparent 60%),
      radial-gradient(900px 600px at 85% 20%, rgba(168,85,247,0.22), transparent 55%),
      radial-gradient(900px 700px at 50% 95%, rgba(34,197,94,0.16), transparent 60%),
      linear-gradient(135deg,#0b1224,#020617 55%, #020617);
}
/* subtle grid overlay */
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background:
    linear-gradient(to right, rgba(255,255,255,0.045) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.035) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(800px 500px at 35% 10%, rgba(0,0,0,0.85), transparent 65%);
  opacity:0.35;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.06), transparent 40%),
              radial-gradient(circle at 80% 10%, rgba(255,255,255,0.05), transparent 45%),
              radial-gradient(circle at 60% 85%, rgba(255,255,255,0.05), transparent 45%);
  opacity:0.35;
}

/* ensure app content sits above overlays */
header, #inputArea{ position:relative; z-index:1; }
/* NOTE: do NOT set z-index on #layout/#sidebar/#overlay here, or sidebar clicks will fall through */

header{
    padding:16px 16px;
    background:rgba(15,23,42,0.62);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    font-size:20px;
    font-weight:800;
    letter-spacing:0.6px;
    border-bottom:1px solid rgba(255,255,255,0.09);
    box-shadow: 0 10px 28px rgba(0,0,0,0.22);
}

header{
    display:flex;
    align-items:center;
    gap:12px;
    border-radius: 0 0 16px 16px;
}

.title{
    flex:1;
    display:flex;
    align-items:center;
    gap:10px;
}

.headerActions{
    display:flex;
    align-items:center;
    gap:10px;
}

.iconBtn{
    width:42px;
    height:42px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:rgba(2,6,23,0.28);
    color:white;
    border:1px solid rgba(255,255,255,0.12);
    border-radius:12px;
    cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
}

.iconBtn:hover{
    transform:translateY(-1px) scale(1.02);
    background:rgba(2,6,23,0.42);
    box-shadow:0 10px 26px rgba(0,0,0,0.28);
}

.chipBtn{
    padding:10px 14px;
    background:rgba(2,6,23,0.28);
    border:1px solid rgba(255,255,255,0.12);
    color:white;
    border-radius:999px;
    cursor:pointer;
    font-weight:700;
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
}

.chipBtn:hover{
    transform:translateY(-1px);
    background:rgba(2,6,23,0.42);
    box-shadow:0 10px 26px rgba(0,0,0,0.28);
}

.chipBtn.danger{
    border-color:rgba(248,113,113,0.25);
}

#layout{
    flex:1;
    display:flex;
    min-height:0;
}

#main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
}

#overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    opacity:0;
    pointer-events:none;
    transition:0.2s;
    z-index:40;
}

#overlay.show{
    opacity:1;
    pointer-events:auto;
}

#sidebar{
    position:fixed;
    top:0;
    left:0;
    height:100vh;
    width:320px;
    background:rgba(15,23,42,0.92);
    backdrop-filter:blur(14px);
    border-right:1px solid rgba(255,255,255,0.08);
    transform:translateX(-105%);
    transition:0.22s ease;
    z-index:50;
    display:flex;
    flex-direction:column;
    box-shadow: 20px 0 60px rgba(0,0,0,0.45);
    pointer-events:auto;
will-change: transform;
}

#sidebar.open{
    transform:translateX(0);
}

.sideTop{
    padding:16px 16px 10px 16px;
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.sideTitle{
    flex:1;
    font-weight:800;
    letter-spacing:0.5px;
}

.sessionList{
    padding:12px;
    overflow:auto;
    flex:1;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.sessionItem{
    padding:12px;
    border-radius:12px;
    background:rgba(2,6,23,0.35);
    backdrop-filter: blur(10px);
    border:1px solid rgba(255,255,255,0.08);
    cursor:pointer;
    transition:0.2s;
}

.sessionItem:hover{
    transform:translateY(-1px);
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
}

.sessionMeta{
    display:flex;
    align-items:center;
    gap:10px;
}

.sessionTitle{
    flex:1;
    font-weight:700;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.sessionTime{
    font-size:12px;
    color:#94a3b8;
}

.sessionActions{
    margin-top:8px;
    display:flex;
    justify-content:flex-end;
}

.delBtn{
    padding:8px 10px;
    border-radius:10px;
    border:1px solid rgba(248,113,113,0.25);
    background:rgba(248,113,113,0.12);
    color:white;
    cursor:pointer;
    transition:0.2s;
}

.delBtn:hover{
    transform:translateY(-1px);
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
}

.sideBottom{
    padding:12px 16px 16px 16px;
    border-top:1px solid rgba(255,255,255,0.08);
}

.hint{
    font-size:12px;
    color:#94a3b8;
    line-height:1.35;
}

#chat{
    flex:1;
    overflow:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:12px;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;

    scrollbar-gutter: stable;
}
/* scrollbar */
#chat::-webkit-scrollbar{ width:10px; }
#chat::-webkit-scrollbar-thumb{
  background: rgba(148,163,184,0.28);
  border: 2px solid rgba(2,6,23,0.65);
  border-radius: 999px;
}
#chat::-webkit-scrollbar-thumb:hover{ background: rgba(148,163,184,0.40); }

.message{
    max-width:65%;
    padding:12px 16px;
    border-radius:16px;
    font-size:15px;
    line-height:1.45;
    animation:fadeIn .25s ease;
    box-shadow:0 10px 30px rgba(0,0,0,0.22);
    border:1px solid rgba(255,255,255,0.08);
    position: relative;
}
.message::before{
  content:"";
  position:absolute;
  inset:-1px;
  border-radius:18px;
  pointer-events:none;
  background: linear-gradient(135deg, rgba(59,130,246,0.35), rgba(168,85,247,0.25), rgba(34,197,94,0.18));
  opacity:0.5; /* 默认就显示气泡光晕 */
  transition:opacity .18s ease;
  z-index:-1;
}
.message:hover{
  transform: translateY(-1px);
  box-shadow: 0 14px 40px rgba(0,0,0,0.28);
}
.message:hover::before{ opacity: 0.85; }

.user{
    background: linear-gradient(135deg, rgba(59,130,246,0.95), rgba(37,99,235,0.92));
    margin-left:auto;
    box-shadow: 0 14px 40px rgba(37,99,235,0.22);
}

.ai{
    background: rgba(30,41,59,0.62);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-color: rgba(255,255,255,0.10);
}

#inputArea{
    display:flex;
    padding:14px 14px;
    background:rgba(15,23,42,0.65);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-top:1px solid rgba(255,255,255,0.10);
    gap:12px;
    box-shadow: 0 -10px 26px rgba(0,0,0,0.20);
}

input{
    flex:1;
    padding:12px 14px;
    font-size:16px;
    border:1px solid rgba(255,255,255,0.10);
    border-radius:12px;
    outline:none;
    background:rgba(2,6,23,0.62);
    color:white;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
}

input::placeholder{
    color:#64748b;
}
input:focus, #inputArea textarea:focus{
  border-color: rgba(59,130,246,0.55);
  box-shadow: 0 0 0 4px rgba(59,130,246,0.18);
}

button{
    padding:12px 22px;
    background:linear-gradient(135deg,#3b82f6,#2563eb);
    color:white;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-weight:800;
    transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
}

button:hover{
    transform:translateY(-1px);
    filter:saturate(1.06);
    box-shadow:0 12px 28px rgba(59,130,246,0.28);
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(8px);} 
    to{opacity:1; transform:translateY(0);} 
}

@keyframes blink{
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}
.cursor{
  display:inline-block;
  margin-left:2px;
  animation: blink 1s steps(1) infinite;
  opacity:0.85;
}
/* send button loading spinner */
#sendBtn.loading{
  position:relative;
  padding-right:44px;
}
#sendBtn.loading::after{
  content:"";
  position:absolute;
  right:14px;
  top:50%;
  width:16px;
  height:16px;
  margin-top:-8px;
  border:2px solid rgba(255,255,255,0.45);
  border-top-color: rgba(255,255,255,0.95);
  border-radius:50%;
  animation: spin .8s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

.modelMenu{
    position:absolute;
    top:70px;
    right:140px;
    background:rgba(15,23,42,0.95);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:12px;
    backdrop-filter:blur(10px);
    display:none;
    flex-direction:column;
    overflow:hidden;
    z-index:60;
    box-shadow:0 18px 55px rgba(0,0,0,0.45);
transform: translateY(-4px);
}

.modelMenu.show{
    display:flex;
}

.modelItem{
    padding:14px 20px;
    cursor:pointer;
    border-bottom:1px solid rgba(255,255,255,0.05);
    transition:transform .16s ease, background .16s ease;
}

.modelItem:hover{
    transform: translateX(2px);
    background:rgba(59,130,246,0.18);
}

.modelBadge{
    margin-left:10px;
    font-size:12px;
    padding:6px 10px;
    border-radius:999px;
    background:rgba(2,6,23,0.35);
    border:1px solid rgba(255,255,255,0.10);
    color:#e2e8f0;
}
.statusDot{
  width:10px;height:10px;border-radius:999px;display:inline-block;
  border:1px solid rgba(255,255,255,0.18);
  background:rgba(148,163,184,0.6);
}
.statusDot.ok{ background:rgba(34,197,94,0.85); }
.statusDot.bad{ background:rgba(239,68,68,0.85); }

.statusText{ font-size:12px; color:#cbd5e1; opacity:0.9; }

.sessionSearch{
  flex:1; padding:10px 12px; border-radius:10px;
  border:1px solid rgba(255,255,255,0.10);
  background:rgba(2,6,23,0.35); color:white; outline:none; font-size:13px;
}
.sessionSearch::placeholder{ color:#94a3b8; }

.sessionItem.active{
  border-color:rgba(59,130,246,0.45);
  box-shadow:0 10px 30px rgba(59,130,246,0.15);
}

.smallIconBtn{
  width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(2,6,23,0.35); color:white;
  border:1px solid rgba(255,255,255,0.10); border-radius:10px;
  cursor:pointer; transition:0.2s;
}
.smallIconBtn:hover{ transform:translateY(-1px); box-shadow:0 6px 18px rgba(0,0,0,0.25); }

.dayDivider{ margin:14px 0 6px; display:flex; justify-content:center; }
.dayDivider span{
  font-size:12px;
  color:#cbd5e1;
  background:rgba(15,23,42,0.55);
  border:1px solid rgba(255,255,255,0.10);
  padding:7px 12px;
  border-radius:999px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 10px 26px rgba(0,0,0,0.22);
}

.msgTop{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; }
.msgTime{ font-size:11px; color:#cbd5e1; opacity:0.75; white-space:nowrap; }

.copyBtn{
  font-size:11px;
  padding:6px 10px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,0.12);
  background:rgba(2,6,23,0.24);
  color:white;
  cursor:pointer;
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
}
.copyBtn:hover{
  transform:translateY(-1px);
  background:rgba(2,6,23,0.40);
  box-shadow:0 10px 24px rgba(0,0,0,0.25);
}

#inputArea textarea{
  flex:1;
  resize:none;
  padding:12px 14px;
  font-size:16px;
  border:1px solid rgba(255,255,255,0.10);
  border-radius:14px;
  outline:none;
  background:rgba(2,6,23,0.62);
  color:white;
  line-height:1.35;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
}
/* ===== 图片生成弹窗 ===== */
#imgModal{
  position:fixed; inset:0;
  display:none; align-items:center; justify-content:center;
  z-index:120;
}
#imgModal.show{ display:flex; }
#imgModal .backdrop{ position:absolute; inset:0; background:rgba(0,0,0,0.55); }
#imgModal .panel{
  position:relative;
  width:min(680px, calc(100vw - 32px));
  background:rgba(15,23,42,0.96);
  border:1px solid rgba(255,255,255,0.10);
  border-radius:16px;
  backdrop-filter:blur(14px);
  box-shadow:0 22px 60px rgba(0,0,0,0.45);
  padding:16px;
  overflow:hidden;
}
#imgModal .panel h3{ margin:0 0 10px; font-size:16px; }
#imgModal textarea{
  width:100%; min-height:110px; resize:vertical;
  padding:12px 14px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.10);
  background:rgba(2,6,23,0.55);
  color:white; outline:none;
  line-height:1.35; font-size:14px;
}
#imgModal .row{ display:flex; gap:10px; justify-content:flex-end; margin-top:12px; }
#imgModal .row .chipBtn{ margin-left:0; }
#imgModal .muted{ margin-top:8px; font-size:12px; color:#94a3b8; line-height:1.35; }

/* ===== 聊天气泡图片展示 ===== */
.msgImg{
  display:block;
  max-width:100%;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.12);
  margin-top:8px;
  box-shadow:0 18px 55px rgba(0,0,0,0.38);
}
.imgCaption{ margin-top:8px; font-size:13px; color:#e2e8f0; line-height:1.35; }

/* ======= Mobile responsive (<= 640px) ======= */
@media (max-width: 640px){
  body{ height:100dvh; }

  header{
    padding:12px;
    font-size:18px;
    gap:8px;
    flex-wrap:wrap;
  }

  .title{ gap:8px; }

  /* 顶部按钮更紧凑，允许换行 */
  .headerActions{
    width:100%;
    justify-content:flex-end;
    gap:6px;
    flex-wrap:wrap;
  }
  .chipBtn{ padding:8px 10px; font-size:13px; }
  .iconBtn{ width:38px; height:38px; border-radius:10px; }

  /* 模型徽章更小 */
  .modelBadge{ font-size:11px; padding:5px 8px; }
  .statusText{ font-size:11px; }

  /* 消息气泡更宽 */
  #chat{ padding:14px; }
  .message{ max-width:88%; font-size:15px; }

  /* 输入区适配手机，贴底 */
  #inputArea{
    position:sticky;
    bottom:0;
    padding:10px;
    gap:10px;
  }

  #inputArea textarea{
    font-size:16px;
    padding:10px 12px;
  }

  #sendBtn{
    padding:10px 14px;
    border-radius:10px;
    white-space:nowrap;
  }

  /* 侧边栏手机全屏 */
  #sidebar{ width:92vw; max-width:92vw; }

  /* 模型菜单别出屏 */
  .modelMenu{
    top:62px;
    right:12px;
    left:auto;
    width:min(260px, calc(100vw - 24px));
  }

  /* 图片弹窗更贴合手机 */
  #imgModal .panel{ padding:14px; }
  #imgModal textarea{ min-height:96px; }

  /* 锁定整体布局：防止页面被拖动/橡皮筋 */
  html, body{ overflow:hidden; height:100dvh; }
  #chat{ touch-action:pan-y; }
  #overlay, #sidebar, #imgModal{ touch-action:manipulation; }
}

/* ======= Small phones (<= 380px) ======= */
@media (max-width: 380px){
  header{ font-size:17px; }
  .chipBtn{ padding:7px 9px; font-size:12px; }
  .message{ max-width:92%; }
}
</style>
</head>

<body>

<header>
  <button class="iconBtn" id="menuBtn" title="历史">☰</button>
  <div class="title">🤖 益群的电子奴隶 
    <span id="modelBadge" class="modelBadge">弱智模式</span>
    <span id="statusDot" class="statusDot" title="连接状态"></span>
    <span id="statusText" class="statusText">检测中…</span>
  </div>
  <div class="headerActions">
    <button class="chipBtn" id="modelBtn" title="模型选择" type="button">模型</button>
<button class="chipBtn" id="imageBtn" title="生成图片" type="button">🖼 图片</button>
<button class="chipBtn" id="privacyBtn" title="隐私模式：不保存聊天历史" type="button">隐私：关</button>
<button class="chipBtn" id="newChatBtn" title="新聊天" type="button">＋ 新聊天</button>
<button class="chipBtn danger" id="clearBtn" title="清空当前" type="button">清空</button>
  </div>
</header>

<div id="modelMenu" class="modelMenu">
    <div class="modelItem" data-model="strong">益群大模型（最强）</div>
    <div class="modelItem" data-model="cheap">弱智模式（最便宜）</div>
    <div class="modelItem" data-model="tianqing">天晴小宝贝（最强）</div>
    <div class="modelItem" data-model="infinity">无尽模型（慎试）</div>
</div>

<div id="overlay"></div>
<div id="imgModal">
    <div class="backdrop" id="imgModalBackdrop"></div>
    <div class="panel">
      <h3>生成图片</h3>
      <textarea id="imgPrompt" placeholder="描述你想要的图片，比如：
  一只戴墨镜的橘猫，帅帅的益群，高清，电影感"></textarea>
      <div class="muted">群哥打造 <b>/哇塞棒</b>（让你体验真正的ai）。</div>
      <div class="row">
        <button class="chipBtn danger" id="imgCancelBtn" type="button">取消</button>
        <button class="chipBtn" id="imgGenBtn" type="button">生成</button>
      </div>
    </div>
  </div>

<div id="layout">
  <aside id="sidebar">
    <div class="sideTop">
      <div class="sideTitle">历史聊天</div>
      <input id="sessionSearch" class="sessionSearch" placeholder="搜索历史…" />
      <button class="iconBtn" id="closeSideBtn" title="关闭">✕</button>
    </div>
    <div id="sessionList" class="sessionList"></div>
    <div class="sideBottom">
      <div class="hint">提示：每次打开网页都会自动开始一个新聊天；旧聊天在这里。</div>
    </div>
  </aside>

  <main id="main">
    <div id="chat"></div>
  </main>
</div>

<div id="inputArea">
    <textarea id="input" rows="1" placeholder="输入消息...（Enter发送，Shift+Enter换行）"></textarea>
    <button id="sendBtn" type="button">发送</button>
</div>

<script>
// ======= 多会话存储（左侧历史） =======
const SESSIONS_KEY = "chatSessions";

// ======= 隐私模式：仅本页面内存，不落盘（sessionStorage 仅用于记住当前标签页状态） =======
const IS_LOCALHOST = (location.hostname === "localhost" || location.hostname === "127.0.0.1");

// ======= 防 iframe 嵌套（meta 里的 frame-ancestors 在多数浏览器会被忽略） =======
try{
  if(window.top !== window.self){
    window.top.location = window.self.location;
  }
}catch(e){ /* ignore */ }

// ======= 线上默认关闭调试日志 =======
const DEBUG = IS_LOCALHOST;

// ======= 隐私模式：默认对外(线上)开启，避免把聊天历史落到 localStorage =======
let privacyMode = (sessionStorage.getItem("privacyMode") === "1");
if(sessionStorage.getItem("privacyMode") === null && !IS_LOCALHOST){
  privacyMode = true;
  sessionStorage.setItem("privacyMode", "1");
}

function loadSessions(){
    if(privacyMode) return [];
    return JSON.parse(localStorage.getItem(SESSIONS_KEY) || "[]");
}

function saveSessions(list){
    if(privacyMode) return;
    localStorage.setItem(SESSIONS_KEY, JSON.stringify(list));
}

function setPrivacyMode(on){
    privacyMode = !!on;
    sessionStorage.setItem("privacyMode", privacyMode ? "1" : "0");

    const btn = document.getElementById("privacyBtn");
    if(btn) btn.textContent = privacyMode ? "隐私：开" : "隐私：关";

    if(privacyMode){
        // 开启隐私：清掉落盘历史
        try{ localStorage.removeItem(SESSIONS_KEY); }catch(e){}
        sessions = [];
        currentSessionId = null;
        history = [];
        try{ seenMessageIds && seenMessageIds.clear && seenMessageIds.clear(); }catch(e){}
        renderSessionList();
        render();
    }else{
        // 关闭隐私：重新载入历史
        sessions = loadSessions();
        renderSessionList();
        render();
    }
}

function uid(){
    return "s_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
}

function fmtTime(ts){
    const d = new Date(ts);
    return d.toLocaleString();
}

function getCurrentSession(){
    if(!currentSessionId) return null;
    return sessions.find(s => s.id === currentSessionId) || null;
}

function createNewSession(){
    // 规则：只创建当前聊天页面，不立刻写入左侧历史。
    // 只有当用户发出第一条消息时（role === "user"）才会创建并保存会话。
    currentSessionId = null;
    history = [];
    render();
    renderSessionList();
}

function openSession(id){
    const s = sessions.find(x=>x.id===id);
    if(!s) return;
    currentSessionId = s.id;
    history = Array.isArray(s.messages) ? s.messages.slice() : [];
    // 兼容旧数据：补上 mode 字段，避免上下文过滤出错
history = history.map(m => {
  if(!m || typeof m !== "object") return m;
  if(!m.mode) m.mode = "cheap";
  return m;
});
    seenMessageIds.clear();
history.forEach(m => { if(m && m.id) seenMessageIds.add(m.id); });
    render();
    setTimeout(closeSidebar, 120);
}

function deleteSession(id){
    sessions = sessions.filter(s=>s.id!==id);
    saveSessions(sessions);

    // 如果删的是当前会话，就立刻新建一个
    if(currentSessionId === id){
        createNewSession();
        return;
    }
    renderSessionList();
}

function syncCurrentToStorage(){
    // 没有会话 id（说明还没真正开始聊天），不写入历史
    if(privacyMode) return;
    if(!currentSessionId) return;

    const s = getCurrentSession();
    if(!s) return;
    s.messages = history.slice();

    // 自动用第一条用户消息当标题
    const firstUser = history.find(m=>m.role==="user" && m.text && m.text.trim());
    if(firstUser){
        s.title = firstUser.text.trim().slice(0, 24);
    }

    saveSessions(sessions);
    renderSessionList();
}

function msgId(){
  return "m_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
}
function pad2(n){ return String(n).padStart(2,"0"); }
function formatTime(ts){
  const d = new Date(ts);
  return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
function dayKey(ts){
  const d = new Date(ts);
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
}
function dayLabel(ts){
  const now = new Date();
  const dk = dayKey(ts);
  const today = dayKey(now.getTime());
  const y = new Date(now.getFullYear(), now.getMonth(), now.getDate()-1).getTime();
  const yesterday = dayKey(y);
  if(dk === today) return "今天";
  if(dk === yesterday) return "昨天";
  return dk;
}
function isNearBottom(el){
  return (el.scrollHeight - el.scrollTop - el.clientHeight) < 60;
}

let typingAbort = null;
let typingMessageId = null;
const seenMessageIds = new Set();
function escapeHtml(s){
  return String(s ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/\"/g,"&quot;")
    .replace(/'/g,"&#39;");
}
async function typeIntoMessage(targetMsgId, fullText){
  if(typingAbort) typingAbort.aborted = true;
  typingAbort = {aborted:false};

  const idx = history.findIndex(m=>m.id===targetMsgId);
  if(idx < 0) return;

  typingMessageId = targetMsgId;

  history[idx].text = "";
  syncCurrentToStorage();
  render();

  // 让速度肉眼可见：每次 1 个字符
  const speed = 28; // ms per char
  for(let i=0; i<fullText.length; i++){
    if(typingAbort.aborted){
      typingMessageId = null;
      render();
      return;
    }
    history[idx].text += fullText[i];

    // 每 6 个字符同步一次存储，减少 localStorage 压力
    if(i % 6 === 0) syncCurrentToStorage();

    render();
    await new Promise(r=>setTimeout(r, speed));
  }

  typingMessageId = null;
  syncCurrentToStorage();
  render();
}
// ======= 流式输出：直接追加（去掉“顺滑打字机队列”，避免重合/重复） =======
let streamLastRenderAt = 0;

function appendTextToMessage(msgId, text){
  if(!msgId || !text) return;
  const idx = history.findIndex(m => m && m.id === msgId);
  if(idx < 0) return;

  history[idx].text = String(history[idx].text || "") + String(text);

  // 节流：不要每个 token 都 render / 写 localStorage
  if((history[idx].text.length % 80) === 0) syncCurrentToStorage();

  const now = Date.now();
  if(now - streamLastRenderAt > 30){
    streamLastRenderAt = now;
    render();
  }
}

// 优先追加到指定目标（继续生成要追加到同一条 AI 气泡）
let target = null;

if(target.id) typingMessageId = target.id;

}

function add(role, text, extra = null){
    if(role === "user" && !currentSessionId){
        const s = { id: uid(), title: "新聊天", createdAt: Date.now(), messages: [] };
        sessions.unshift(s);
        saveSessions(sessions);
        currentSessionId = s.id;
    }

    const base = { id: msgId(), role, text, ts: Date.now(), mode: currentModelMode };
    if(extra && typeof extra === "object") Object.assign(base, extra);

    history.push(base);
    syncCurrentToStorage();
    render();
}

async function send(){
    // ===== 停止生成：正在生成时再次点击发送按钮 =====
    if(isSending && currentAbortController){
        // 停止：记录继续目标（优先用 streamTargetId；否则回退到最后一条 AI 气泡）
        let targetId = streamTargetId;
        if(!targetId){
          for(let i = history.length - 1; i >= 0; i--){
            const m = history[i];
            if(m && m.role === "ai" && m.id){
              targetId = m.id;
              break;
            }
          }
        }
        if(targetId && lastStreamMode){
          canContinue = true;
          continueTarget = { msgId: targetId, mode: lastStreamMode };
        }

        // 只 abort，不要立刻把 currentAbortController 置空；否则 callAI 里无法稳定识别 aborted
        currentAbortController.abort();

        // 立刻恢复可输入（用户可以直接发新消息）
        isSending = false;
        sendBtn.classList.remove("loading");
        sendBtn.textContent = "发送";
        input.disabled = false;
        input.focus();
        render();
        return;
    }

    if(isSending) return;

    isSending = true;
    sendBtn.textContent = "停止";
    sendBtn.classList.add("loading");
    input.disabled = true;

    const text = input.value.trim();
    if(!text) {
        isSending = false;
        currentAbortController = null;
        sendBtn.classList.remove("loading");
        sendBtn.textContent = "发送";
        input.disabled = false;
        return;
    }
    const modeAtSend = currentModelMode; // 锁定本次请求使用的模式，避免中途切换导致串模式
// ===== 图片指令：/img 或 /图 =====
if(/^\/(img|图)\s+/i.test(text)){
    const prompt = text.replace(/^\/(img|图)\s+/i, "").trim();

    // 按当前模式记录用户消息
    const prevModeCmd = currentModelMode;
    currentModelMode = modeAtSend;
    add("user", text);
    currentModelMode = prevModeCmd;
    input.value = "";

    // 占位
    const prevMode2 = currentModelMode;
    currentModelMode = modeAtSend;
    add("ai","正在生成图片…");
    currentModelMode = prevMode2;

    const placeholder = history[history.length - 1];

    try{
      const r = await apiFetch(IMAGE_URL, {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({
          prompt,
          mode: modeAtSend,
          model: (modeAtSend === "infinity") ? "grok-imagine-image" : "gpt-image-1"
        })
      });

      if(!r.ok){
        const t = await r.text().catch(()=> "");
        throw new Error(r.status + " " + t);
      }

      const data = await r.json().catch(()=> ({}));
      const img = (data && typeof data.image === "string") ? data.image.trim() : "";

      if(!img) throw new Error("后端没有返回 image 字段");

      // 用图片替换占位
      placeholder.text = prompt;
      placeholder.image = img;

      syncCurrentToStorage();
      render();

    }catch(err){
      placeholder.text = "图片生成失败：" + (err.message || String(err));
      syncCurrentToStorage();
      render();
    }

    // 释放发送锁
    isSending = false;
    currentAbortController = null;
    sendBtn.classList.remove("loading");
    sendBtn.textContent = "发送";
    input.disabled = false;
    input.focus();
    return;
}

    // 用锁定模式写入消息（避免发送后马上切模式造成这条消息被标到新模式）
    const prevMode = currentModelMode;
    currentModelMode = modeAtSend;
    add("user",text);
    currentModelMode = prevMode;
    input.value = "";

    // “正在思考...”也归属本次锁定模式
    const prevMode2 = currentModelMode;
    currentModelMode = modeAtSend;
    add("ai","正在思考...");
    currentModelMode = prevMode2;
    const thinkMsg = history[history.length - 1];
    if(thinkMsg && thinkMsg.id) seenMessageIds.add(thinkMsg.id);
    // 本次流式追加目标就是这条占位 AI 消息
    streamTargetId = thinkMsg && thinkMsg.id ? thinkMsg.id : null;
    lastStreamMode = modeAtSend;

    let reply = "";
    try{
        reply = await callAI(text, modeAtSend);
    }catch(err){
        // 被停止生成：不走伪AI，不覆盖已生成内容
        if(err && (err.name === "AbortError" || /aborted/i.test(String(err.message||"")))){
            lastCallAborted = true;
            const targetId = streamTargetId || (continueTarget && continueTarget.msgId);
            if(targetId){
              canContinue = true;
              continueTarget = { msgId: targetId, mode: modeAtSend };
            }

            // 释放 UI / 锁（即使 stop 分支已做过，这里也保证状态一致）
            isSending = false;
            currentAbortController = null;
            sendBtn.classList.remove("loading");
            sendBtn.textContent = "发送";
            input.disabled = false;
            input.focus();

            // 清理流式目标（继续生成会在 continueGenerationFrom 里重新设置）
            streamTargetId = null;
            lastStreamMode = null;

            render();
            return;
        }
        reply = "我连不上真正AI（" + (err && err.message ? err.message : String(err)) + "）。\n先用离线伪AI回复：" + (await fakeAI(text));
    }

    const last = history[history.length - 1];
if(last && last.role === "ai"){
  // ✅ 流式时 reply 过程中已经逐步写入；这里兜底：如果还没写入任何内容，就一次性填上
  const cur = String(last.text || "").trim();
  if(!cur || cur === "正在思考..." || cur === "..." || cur === "…"){
    last.text = reply;
  }
  // 结束：去掉光标
  // 收尾：把队列内容全部打完后再最终同步一次（如果还在打字就稍后会同步）
  typingMessageId = null;
  syncCurrentToStorage();
  render();
} else {
  add("ai", reply);
  // 收尾：把队列内容全部打完后再最终同步一次（如果还在打字就稍后会同步）
  typingMessageId = null;
  syncCurrentToStorage();
  render();
}

    // 释放发送锁：发送按钮永远回到“发送”，继续按钮在气泡里显示
    isSending = false;
    currentAbortController = null;
    sendBtn.classList.remove("loading");
    sendBtn.textContent = "发送";

    input.disabled = false;
    input.focus();

    // 正常结束后不保留继续按钮
    if(!lastCallAborted){
      canContinue = false;
      continueTarget = null;
    }

    streamTargetId = null;
    lastStreamMode = null;

    render();
}

async function continueGenerationFrom(aiMsgId){
  if(isSending) return;
  if(!continueTarget || continueTarget.msgId !== aiMsgId) return;

  const modeLocked = continueTarget.mode || currentModelMode;

  // 开始继续
  isSending = true;
  sendBtn.textContent = "停止";
  sendBtn.classList.add("loading");
  input.disabled = true;

  // 继续生成：追加到同一条 AI 消息
  streamTargetId = aiMsgId;
  lastStreamMode = modeLocked;

  // 往上下文里塞一个“隐藏的继续”触发词（不显示在 UI）
  const prevMode = currentModelMode;
  currentModelMode = modeLocked;
  add("user", "继续", { hidden: true });
  currentModelMode = prevMode;

  try{
    const reply = await callAI("继续", modeLocked);

    // 非流式兜底：手动追加
    if(!lastCallStreamed && reply && String(reply).trim()){
      appendTextToMessage(aiMsgId, "\n" + String(reply));
      syncCurrentToStorage();
      render();
    }
  }catch(err){
    // Abort 不提示；其它错误提示到这条AI消息末尾
    if(!(err && (err.name === "AbortError" || /aborted/i.test(String(err.message||""))))){
      appendTextToMessage(aiMsgId, "\n\n（继续生成失败：" + (err && err.message ? err.message : String(err)) + "）");
      syncCurrentToStorage();
      render();
    }
  }

  // 收尾：允许发新消息
  isSending = false;
  currentAbortController = null;
  sendBtn.classList.remove("loading");
  sendBtn.textContent = "发送";
  input.disabled = false;
  input.focus();

  // 如果这次继续又被停止，继续按钮保留；否则关闭
  if(lastCallAborted){
    canContinue = true;
    continueTarget = { msgId: aiMsgId, mode: modeLocked };
  }else{
    canContinue = false;
    continueTarget = null;
  }

  streamTargetId = null;
  lastStreamMode = null;
  render();
}

// ======= AI 逻辑 =======
// ======= 调试开关：只允许在本机 localhost 用假AI（线上永远走后端） =======
// 用法：本机打开 http://localhost:xxxx/ai-chat.html?fake=1 才会启用 fakeAI
const DEV_FAKE = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
  && (new URLSearchParams(location.search).get("fake") === "1");
// ======= 上下文：只读取当前页面聊天框里的消息（history），不读取任何其它来源 =======
// 仍可设置一个上限来省 token（不想限制就把它设得很大）
const MAX_CONTEXT_MESSAGES = 9999;
// ======= API endpoints (auto route: local dev vs GitHub Pages vs Render) =======
// Priority:
// 1) window.__BACKEND_BASE__ (manual override)
// 2) ?backend=https://... (query override)
// 3) Auto:
//    - If page is served by Render backend domain -> same-origin ("" => relative)
//    - If page is on localhost but NOT port 8787 -> use http://localhost:8787
//    - If page is on GitHub Pages -> use Render backend
const DEFAULT_RENDER_BACKEND = "https://yiqun-ai-chat.onrender.com";

function normalizeBase(u){
  const s = String(u || "").trim();
  if(!s) return "";
  return s.endsWith("/") ? s.slice(0, -1) : s;
}

function computeBackendBase(){
  // Query override (安全：只允许本机调试用，线上禁止被链接劫持到假后端)
  try{
    const q = new URLSearchParams(location.search).get("backend");
    if(q && IS_LOCALHOST) return normalizeBase(q);
  }catch(e){}

  const host = String(location.hostname || "").toLowerCase();
  const port = String(location.port || "");

  // If served by Render backend itself, keep same-origin
  if(host.endsWith("onrender.com")) return "";

  // Local dev: if you're serving the HTML from another port (e.g., Live Server), still call backend 8787
  if(host === "localhost" || host === "127.0.0.1"){
    if(port === "8787") return "";
    return "http://localhost:8787";
  }

  // GitHub Pages should call Render backend
  if(host.endsWith("github.io")) return DEFAULT_RENDER_BACKEND;

  // Default: same-origin
  return "";
}

const BACKEND_BASE = normalizeBase(
  (window.__BACKEND_BASE__ && String(window.__BACKEND_BASE__).trim())
) || computeBackendBase();

const CHAT_URL  = BACKEND_BASE + "/api/chat";
const PING_URL  = BACKEND_BASE + "/api/ping";
const IMAGE_URL = BACKEND_BASE + "/api/image";
// Always include cookies (sid) for ALL backend calls.
function apiFetch(url, options){
  const opt = options ? { ...options } : {};
  opt.credentials = "include";
  return fetch(url, opt);
}

let __activationTried = false;

if(DEBUG){
  console.log("[backend] BASE=", BACKEND_BASE || "(same-origin)");
  console.log("[backend] CHAT_URL=", CHAT_URL);
}

function openImgModal(){

// ======= 认证（前端不再向普通用户索要“密钥”） =======
// 说明：
// - OpenAI/Grok 等“服务密钥”永远只在后端。
// - 这里保留一个“管理员调试门禁”的兼容入口：只有 URL 带 ?admin=1 才会询问 API_KEY。
//   等你后端改成“邀请码/会话 cookie”后，这个 admin 门禁可以再删掉。

const API_KEY_STORAGE = "yiqun_api_key";

function getApiKey(){
  return String(sessionStorage.getItem(API_KEY_STORAGE) || "").trim();
}

function isAdminGateEnabled(){
  // 安全：管理员密钥输入只允许在本机调试（localhost）开启
  if(!IS_LOCALHOST) return false;
  try{
    return new URLSearchParams(location.search).get("admin") === "1";
  }catch(e){
    return false;
  }
}

function ensureAdminApiKeyIfNeeded(){
  if(!isAdminGateEnabled()) return "";
  let k = getApiKey();
  if(k) return k;
  k = String(prompt("管理员模式：请输入访问密钥（API_KEY）：") || "").trim();
  if(k) sessionStorage.setItem(API_KEY_STORAGE, k);
  return k;
}

function authHeaders(){
  const h = { "Content-Type": "application/json" };
  const k = ensureAdminApiKeyIfNeeded();
  if(k) h["X-API-Key"] = k;
  return h;
}

// ======= 邀请码激活（后端稍后会加 /api/auth；现在先把前端准备好） =======
async function ensureActivatedOnce(){
  const code = String(prompt("请输入邀请码（仅首次激活一次）：") || "").trim();
  if(!code) throw new Error("未输入邀请码");

  const r = await apiFetch(BACKEND_BASE + "/api/auth", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ code })
});

  if(!r.ok){
    const t = await r.text().catch(()=> "");
    throw new Error("邀请码验证失败：" + r.status + " " + t);
  }

  return true;
}

async function generateImageFromModal(){
  const p = String(imgPrompt && imgPrompt.value ? imgPrompt.value : "").trim();
  if(!p) return;

  closeImgModal();

  add("ai","正在生成图片…");
  const placeholder = history[history.length - 1];

  try{
    const modeLocked = currentModelMode;
    const r = await apiFetch(IMAGE_URL, {
      method: "POST",
      headers: authHeaders(),
      body: JSON.stringify({
        prompt: p,
        mode: modeLocked,
        model: (modeLocked === "infinity") ? "grok-imagine-image" : "gpt-image-1"
      })
    });

    if(!r.ok){
      const t = await r.text().catch(()=> "");
      throw new Error(r.status + " " + t);
    }

    const data = await r.json().catch(()=> ({}));
    const img = (data && typeof data.image === "string") ? data.image.trim() : "";
    if(!img) throw new Error("后端没有返回 image 字段");

    placeholder.text = p;
    placeholder.image = img;
    syncCurrentToStorage();
    render();
  }catch(err){
    placeholder.text = "图片生成失败：" + (err && err.message ? err.message : String(err));
    syncCurrentToStorage();
    render();
  }
}
async function regenerateImageForMessage(messageId){
  if(DEBUG) console.log("[regen] start", { messageId, IMAGE_URL });
  const idx = history.findIndex(m => m && m.id === messageId);
  if(idx < 0){
    if(DEBUG) console.log("[regen] not found", messageId);
    return;
  }

  const m = history[idx];
  const prompt = String(m.text || "").trim();
  if(!prompt){
    alert("没有提示词");
    return;
  }

  const modeLocked = m.mode || currentModelMode;

  // 占位：先清掉旧图
  m.text = "正在重新生成图片…";
  delete m.image;
  syncCurrentToStorage();
  render();

  // 复用你现有的图片请求（你现在 /img 功能里就在用）
  if(DEBUG) console.log("[regen] request", { prompt: prompt.slice(0,120), modeLocked });
  const r = await apiFetch(IMAGE_URL, {
    method: "POST",
    headers: authHeaders(),
    body: JSON.stringify({
      prompt,
      mode: modeLocked,
      model: (modeLocked === "infinity") ? "grok-imagine-image" : "gpt-image-1"
    })
  });

  if(!r.ok){
    const t = await r.text().catch(()=> "");
    m.text = "图片生成失败：" + r.status + " " + t;
    syncCurrentToStorage();
    render();
    return;
  }

  const data = await r.json().catch(()=> ({}));
  if(DEBUG) console.log("[regen] response", data);
  const img = (data && typeof data.image === "string") ? data.image.trim() : "";
  if(!img){
    m.text = "图片生成失败：后端没有返回 image 字段";
    syncCurrentToStorage();
    render();
    return;
  }

  m.text = prompt;
  m.image = img;
  syncCurrentToStorage();
  render();
}

function buildContextWindow(){
  // 严格规则：只读取“当前页面聊天框”里可见的消息（history）作为上下文
  // 不读取左侧历史、localStorage 其它会话、其它页面、其它模式等任何东西
  const trimmed = history
    .filter(m => m && (m.role === "user" || m.role === "ai"))
    .filter(m => m.text && String(m.text).trim())
    .slice(-MAX_CONTEXT_MESSAGES);

  // 如果最后一条是“正在思考...”，不要把它发给后端
  if(trimmed.length && trimmed[trimmed.length - 1].role === "ai"){
    const t = String(trimmed[trimmed.length - 1].text || "").trim();
    if(t === "正在思考..." || t === "…" || t === "...") trimmed.pop();
  }

  return trimmed;
}

async function checkBackend(){
  // 如果页面元素还没准备好，懒加载获取
  const dot = document.getElementById("statusDot");
  const text = document.getElementById("statusText");
  if(!dot || !text) return;

  const pingUrl = PING_URL;
  if(DEBUG) console.log("[ping] GET", pingUrl);

  // 先显示检测中
  text.textContent = "检测中…";
  dot.classList.remove("ok","bad");

  const ctrl = new AbortController();
  const timer = setTimeout(()=> ctrl.abort(), 1800);

  try{
    const r = await apiFetch(pingUrl, { method: "GET", signal: ctrl.signal });
    clearTimeout(timer);

    if(r.ok){
      dot.classList.add("ok");
      dot.classList.remove("bad");
      text.textContent = "在线";
    }else{
      dot.classList.add("bad");
      dot.classList.remove("ok");
      text.textContent = "后端异常";
    }
  }catch(e){
    clearTimeout(timer);
    dot.classList.add("bad");
    dot.classList.remove("ok");
    text.textContent = "离线";
  }
}

// ======= Mobile: 防止缩放/双击放大（iOS/安卓浏览器） =======
(function lockMobileViewport(){
  const isMobile = window.matchMedia && window.matchMedia('(max-width: 640px)').matches;
  if(!isMobile) return;

  // 阻止 iOS 的手势缩放
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('gesturechange', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('gestureend', function(e){ e.preventDefault(); }, {passive:false});

  // 阻止双指缩放（部分浏览器会触发）
  document.addEventListener('touchmove', function(e){
    if(e.touches && e.touches.length > 1){
      e.preventDefault();
    }
  }, {passive:false});
})();
// ======= 页面初始化：每次打开都自动开始一个新聊天 =======
// 旧聊天只在左侧历史里，不会出现在当前页面
createNewSession();
checkBackend();

autoGrowTextarea();

async function callAI(msg, modeLocked = currentModelMode){
  lastCallAborted = false;
  lastCallStreamed = false;
  if(DEV_FAKE) return fakeAI(msg);

  // IMPORTANT: Do NOT put system prompts / red-line rules / model vendor info in the front-end.
  // Front-end only sends the conversation window and the selected "mode".
  if(DEBUG) console.log("[callAI] mode=", modeLocked);

  if(DEBUG){
    try{
      const ctx = buildContextWindow();
      const lastUser = [...ctx].reverse().find(m => m && m.role === "user");
      console.log("[callAI] ctx_len=", ctx.length, "last_user=", lastUser ? lastUser.text : "(none)");
    }catch(e){
      console.log("[callAI] ctx_debug_error", e);
    }
  }

  const payloadHistory = buildContextWindow();

  // 兼容多数后端/模型：assistant 角色名通常必须是 "assistant"，不要用 "ai"
  const normalizedHistory = payloadHistory.map(m => {
    if(!m || typeof m !== "object") return m;
    const r = m.role;
    return {
      ...m,
      role: (r === "ai") ? "assistant" : r
    };
  });

  const payload = {
    history: normalizedHistory,
    mode: modeLocked,
    stream: true
  };

  currentAbortController = new AbortController();

  const r = await apiFetch(CHAT_URL, {
  method: "POST",
  headers: authHeaders(),
  body: JSON.stringify(payload),
  signal: currentAbortController.signal
});

  if(!r.ok){
    if(r.status === 401){
      // Auto-attempt activation ONCE for any 401 (some servers don't return JSON).
      if(!__activationTried){
        __activationTried = true;
        try{
          await ensureActivatedOnce();
          return await callAI(msg, modeLocked);
        }catch(e){
          // continue to readable error
        }
      }

      let j = null;
      try{ j = await r.clone().json(); }catch(e){ j = null; }
      const errCode = j && (j.error || j.code) ? String(j.error || j.code) : "";
      throw new Error(errCode ? ("未授权（401）：" + errCode) : "未授权（401）。请先输入邀请码激活，然后再试。");
    }

    const t = await r.text().catch(()=>" ");
    throw new Error("后端错误：" + r.status + " " + t);
  }

  const ct = (r.headers.get("content-type") || "").toLowerCase();

// ✅ 流式：边读边显示（兼容更多 SSE 格式）
if(ct.includes("text/event-stream")){
  const reader = r.body.getReader();
  const decoder = new TextDecoder("utf-8");
  lastCallStreamed = true;
  let buffer = "";
  let full = "";
  let gotAny = false;

  while(true){
    if(currentAbortController && currentAbortController.signal.aborted){
      break;
    }

    let value, done;
try{
  ({ value, done } = await reader.read());
}catch(e){
  if(currentAbortController && currentAbortController.signal.aborted){
    lastCallAborted = true;
    break;
  }
  throw e;
}
    if(done) break;

    buffer += decoder.decode(value, { stream: true });

    // SSE 每条事件用空行分隔（兼容 \r\n\r\n）
    const parts = buffer.split(/\r?\n\r?\n/);
    buffer = parts.pop() || "";

    for(const part of parts){
      const rawLines = part.split(/\r?\n/);
      const lines = rawLines.map(s=>s.trim()).filter(Boolean);
      if(!lines.length) continue;

      // 忽略 SSE 注释行，如 :ok
      if(lines.length === 1 && lines[0].startsWith(":")) continue;

      const isDone = lines.some(l => l.startsWith("event:") && /done/i.test(l));
      const isError = lines.some(l => l.startsWith("event:") && /error/i.test(l));

      // 一个事件里可能有多行 data:
      const dataLines = lines.filter(l => l.startsWith("data:"));
      if(!dataLines.length){
        if(isDone) continue;
        // 没 data 的事件就跳过
        continue;
      }

      const dataStr = dataLines.map(l => l.slice(5).trim()).join("\n");

      // done 事件：结束但不丢最后的 data（有些实现会带 data: {})
      if(isDone){
        continue;
      }

      // 先尝试按 JSON 解析
      let parsed = null;
      try{ parsed = JSON.parse(dataStr); }catch(_e){ parsed = null; }

      // 1) 标准：{delta:"..."}
      if(parsed && typeof parsed.delta === "string" && parsed.delta.length){
        gotAny = true;
        full += parsed.delta;
        appendDeltaToLastAI(parsed.delta);
        continue;
      }

      // 2) 错误事件：{message:"..."}
      if(isError && parsed && typeof parsed.message === "string" && parsed.message.length){
        const msg = "[后端错误] " + parsed.message;
        gotAny = true;
        full += msg;
        appendDeltaToLastAI(msg);
        continue;
      }

      // 3) 兜底：把 data 当纯文本 delta（有些后端会直接 data: hello）
      if(dataStr && String(dataStr).trim()){
        const textDelta = String(dataStr);
        gotAny = true;
        full += textDelta;
        appendDeltaToLastAI(textDelta);
        continue;
      }
    }
  }

  if(currentAbortController && currentAbortController.signal.aborted){
  lastCallAborted = true;
  appendDeltaToLastAI("\n\n（已停止生成）");
}
  syncCurrentToStorage();
  return (gotAny && String(full).trim()) ? full : "(没有返回内容)";
}

// 非流式：保持原来 JSON
lastCallStreamed = false;
const data = await r.json();
return data.reply || "(没有返回内容)";
}

// 伪AI：不需要任何Key，离线可用
async function fakeAI(msg){
    await new Promise(r=>setTimeout(r,800));

    if(msg.includes("你好"))
        return "你好呀 👋";

    if(msg.includes("你是谁"))
        return "我是益群开发并集成的聊天助手 😎";

    if(msg.includes("时间"))
        return "现在时间是 " + new Date().toLocaleTimeString();

    if(msg.includes("笑话"))
        return "程序员为什么分不清圣诞节和万圣节？因为 Oct 31 == Dec 25";

    return "你说的是：" + msg;
}
